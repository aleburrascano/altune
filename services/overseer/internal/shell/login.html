<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overseer — Sign in</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 system-ui, sans-serif; background: #0b0e14; color: #e6e6e6; }
    form { width: min(340px, 90vw); background: #111624; border: 1px solid #1c2333;
      border-radius: 10px; padding: 24px; display: grid; gap: 12px; }
    h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: .04em; text-align: center; }
    label { font-size: 13px; color: #8a93a6; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #1c2333; background: #0b0e14; color: #e6e6e6; font: inherit; }
    button { padding: 10px 12px; border: 0; border-radius: 8px; background: #2b5cff;
      color: #fff; font: inherit; cursor: pointer; }
    .error { margin: 0; color: #ff6b6b; font-size: 13px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>OVERSEER</h1>
    <label for="token">Owner token</label>
    <input id="token" name="token" type="password" autocomplete="off" autofocus required />
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
