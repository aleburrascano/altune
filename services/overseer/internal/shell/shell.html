<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overseer</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0b0e14; color: #e6e6e6; }
    header { padding: 16px 24px; border-bottom: 1px solid #1c2333; }
    header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
    header p { margin: 4px 0 0; color: #8a93a6; font-size: 13px; }
    main { display: grid; gap: 16px; padding: 24px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .panel { background: #111624; border: 1px solid #1c2333; border-radius: 10px; padding: 16px; }
    .panel h2 { margin: 0 0 8px; font-size: 14px; color: #c7d0e0; }
    .empty { color: #6b7488; }
  </style>
</head>
<body>
  <header>
    <h1>OVERSEER</h1>
    <p>{{.PanelCount}} bucket(s) reporting</p>
  </header>
  <main>
    {{range .Panels}}
    <section class="panel">
      <h2>{{.Title}}</h2>
      {{.Body}}
    </section>
    {{else}}
    <p class="empty">No buckets registered.</p>
    {{end}}
  </main>
</body>
</html>
