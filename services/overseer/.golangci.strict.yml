version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - errorlint
    - bodyclose
    - unconvert
    - nilerr
    - misspell
    - dupl
    - revive
    - forbidigo
    - depguard
    - testpackage
    - nilnil
    - exhaustive
    - noctx
    - errchkjson
    - errname
    - gochecknoinits
    - usestdlibvars
    - musttag
    - usetesting
    - nilnesserr
    - durationcheck

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    dupl:
      threshold: 150
    testpackage:
      skip-regexp: ^$
    depguard:
      rules:
        feature-buckets:
          files: ["**/internal/buckets/**"]
          deny:
            - pkg: altune/overseer/internal/app
              desc: a feature never imports another feature or internal/app, connect them in internal/app (read services/overseer/internal/README.md)
            - pkg: altune/overseer/internal/shell
              desc: a feature never imports another feature or internal/app, connect them in internal/app (read services/overseer/internal/README.md)
