            - pkg: altune/overseer/internal/buckets/security
              desc: a bucket never imports another bucket, connect them in internal/app (read services/overseer/internal/README.md)
        feature-shell:
          files: ["**/internal/shell/**"]
          deny:
            - pkg: altune/overseer/internal/app
              desc: a feature never imports another feature or internal/app, connect them in internal/app (read services/overseer/internal/README.md)
            - pkg: altune/overseer/internal/buckets
              desc: a feature never imports another feature or internal/app, connect them in internal/app (read services/overseer/internal/README.md)
        guard-is-imported-by-nothing:
          files:
            - "**/overseer/internal/**"
            - "**/overseer/cmd/**"
            - "!**/overseer/internal/guard/**"
          deny:
            - pkg: altune/overseer/internal/guard
              desc: internal/guard holds the whole-tree contract tests and nothing imports it (read services/overseer/internal/README.md)
        shared:
          files:
            - "**/overseer/internal/authn/**"
            - "**/overseer/internal/config/**"
            - "**/overseer/internal/core/**"
            - "**/overseer/internal/goapi/**"
            - "**/overseer/internal/history/**"
            - "**/overseer/internal/oci/**"
            - "**/overseer/internal/panicguard/**"
            - "**/overseer/internal/webui/**"
          deny:
            - pkg: altune/overseer/internal/app
              desc: a shared module never imports a feature or internal/app (read services/overseer/internal/README.md)
            - pkg: altune/overseer/internal/shell
              desc: a shared module never imports a feature or internal/app (read services/overseer/internal/README.md)
            - pkg: altune/overseer/internal/buckets
              desc: a shared module never imports a feature or internal/app (read services/overseer/internal/README.md)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read settings once in internal/config and pass them in
        - pattern: ^recover$
          msg: contain a panic through panicguard.Try, Call or Contain (services/overseer/internal/panicguard), the one panic guard
        - pattern: ^sync\.WaitGroup$
          msg: run goroutines through panicguard.Group (services/overseer/internal/panicguard) so a panic in one is contained and reported by Wait

    revive:
      rules:
        - name: indent-error-flow
        - name: superfluous-else
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - unnamedResult

  exclusions:
    generated: lax
    paths:
      - node_modules/
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocritic
          - revive
          - forbidigo
          - noctx
      - path: ^internal/panicguard/
        linters:
          - forbidigo
        text: use of `(recover|sync\.WaitGroup)` forbidden
      - path: ^cmd/
        linters:
          - forbidigo
        text: internal/config

formatters:
  enable:
    - gofumpt
