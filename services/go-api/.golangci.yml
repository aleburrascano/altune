version: "2"

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        domain-purity:
          list-mode: strict
          files:
            - "**/internal/catalog/domain/**"
            - "**/internal/discovery/domain/**"
            - "**/internal/playback/domain/**"
          allow:
            - $gostd
            - altune/go-api/internal/catalog/domain
            - altune/go-api/internal/discovery/domain
            - altune/go-api/internal/playback/domain
            - altune/go-api/internal/shared$
            - altune/go-api/internal/shared/domain
            - altune/go-api/internal/shared/sharedtest
            - altune/go-api/internal/shared/songfacts
            - altune/go-api/internal/shared/textnorm
            - altune/go-api/internal/shared/versiontag
            - github.com/google/uuid
            - golang.org/x/text
          deny:
            - pkg: altune/go-api/internal/shared/
              desc: domain may import from internal/shared only the root value objects, shared/domain and the pure text packages (songfacts, textnorm, versiontag)

        catalog-boundary:
          files:
            - "**/internal/catalog/service/**"
            - "**/internal/catalog/ports/**"
            - "**/internal/catalog/adapters/**"
            - "!**/internal/catalog/adapters/discoverybridge/**"
          deny:
            - pkg: altune/go-api/internal/discovery
              desc: catalog reaches discovery only through adapters/discoverybridge
            - pkg: altune/go-api/internal/playback
              desc: catalog never imports playback
            - pkg: altune/go-api/internal/observe
              desc: catalog never imports observe

        discovery-boundary:
          files:
            - "**/internal/discovery/service/**"
            - "**/internal/discovery/ports/**"
            - "**/internal/discovery/adapters/**"
            - "!**/internal/discovery/adapters/catalogbridge/**"
          deny:
            - pkg: altune/go-api/internal/catalog
              desc: discovery reaches catalog only through adapters/catalogbridge
            - pkg: altune/go-api/internal/playback
              desc: discovery never imports playback
            - pkg: altune/go-api/internal/observe
              desc: discovery never imports observe

        auth-boundary:
          files:
            - "**/internal/auth/**"
          deny:
            - pkg: altune/go-api/internal/catalog
              desc: auth never imports catalog
            - pkg: altune/go-api/internal/discovery
              desc: auth never imports discovery
            - pkg: altune/go-api/internal/playback
              desc: auth never imports playback
            - pkg: altune/go-api/internal/acquisition
              desc: auth never imports acquisition
            - pkg: altune/go-api/internal/observe
              desc: auth never imports observe

        acquisition-boundary:
          files:
            - "**/internal/acquisition/service/**"
            - "**/internal/acquisition/ports/**"
            - "**/internal/acquisition/adapters/**"
            - "!**/internal/acquisition/adapters/discoverybridge/**"
          deny:
            - pkg: altune/go-api/internal/discovery
              desc: acquisition reaches discovery only through adapters/discoverybridge
            - pkg: altune/go-api/internal/playback
              desc: acquisition never imports playback
            - pkg: altune/go-api/internal/observe
              desc: acquisition never imports observe

        observe-boundary:
          list-mode: strict
          files:
            - "**/internal/observe/**"
            - "!$test"
          allow:
            - $gostd
            - altune/go-api/internal/observe
            - altune/go-api/internal/shared
            - altune/go-api/internal/auth
            - altune/go-api/internal/discovery/domain
            - altune/go-api/internal/discovery/ports
            - altune/go-api/internal/acquisition/ports
            - github.com/go-chi/chi/v5

        observe-leaf-boundary:
          list-mode: strict
          files:
            - "**/internal/observe/eventtap/**"
            - "**/internal/observe/evalmeter/**"
            - "**/internal/observe/alert/**"
            - "!$test"
          allow:
            - $gostd
            - altune/go-api/internal/shared

        shared-bottom:
          files:
            - "**/internal/shared/**"
          deny:
            - pkg: altune/go-api/internal/acquisition
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/observe
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/app
              desc: internal/shared never imports the composition root
            - pkg: altune/go-api/internal/auth
              desc: internal/shared never imports auth
            - pkg: altune/go-api/internal/catalog
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/discovery
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/playback
              desc: internal/shared never imports feature packages

        layer-service-inward:
          files:
            - "**/internal/*/service/**"
            - "!$test"
          deny:
            - pkg: altune/go-api/internal/catalog/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/discovery/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/playback/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/acquisition/adapters
              desc: service is driven by ports, it never imports adapters

        layer-service-inward-acquisition-eval:
          list-mode: lax
          files:
            - "**/internal/acquisition/adapters/eval/**"
          allow:
            - altune/go-api/internal/acquisition/adapters/catalogpin
            - altune/go-api/internal/acquisition/adapters/discoverybridge
            - altune/go-api/internal/acquisition/adapters/tempfs
            - altune/go-api/internal/acquisition/adapters/ytmsearch
            - altune/go-api/internal/acquisition/adapters/ytmusic
          deny:
            - pkg: altune/go-api/internal/catalog/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/discovery/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/playback/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/acquisition/adapters
              desc: the eval harness may compose only the catalogpin, discoverybridge, tempfs, ytmusic and ytmsearch adapters

        acquisition-service-filesystem:
          files:
            - "**/internal/acquisition/service/**"
            - "!$test"
          deny:
            - pkg: "os$"
              desc: acquisition service reaches the filesystem only through ports.TempWorkspace

        layer-ports-inward:
          files:
            - "**/internal/*/ports/**"
          deny:
            - pkg: altune/go-api/internal/catalog/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/discovery/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/playback/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/acquisition/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/catalog/adapters
              desc: ports are pure contracts, they never import adapters
            - pkg: altune/go-api/internal/discovery/adapters
              desc: ports are pure contracts, they never import adapters
            - pkg: altune/go-api/internal/playback/adapters
              desc: ports are pure contracts, they never import adapters
            - pkg: altune/go-api/internal/acquisition/adapters
              desc: ports are pure contracts, they never import adapters
