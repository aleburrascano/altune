version: "2"

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        domain-purity:
          list-mode: strict
          files:
            - "**/internal/catalog/domain/**"
            - "**/internal/discovery/domain/**"
            - "**/internal/playback/domain/**"
          allow:
            - $gostd
            - altune/go-api/internal/catalog/domain
            - altune/go-api/internal/discovery/domain
            - altune/go-api/internal/playback/domain
            - altune/go-api/internal/shared$
            - altune/go-api/internal/shared/textnorm
            - github.com/google/uuid
            - golang.org/x/text
          deny:
            - pkg: altune/go-api/internal/shared/
              desc: domain may import from internal/shared only the root value objects and textnorm (.claude/rules/backend/domain-layer.md)

        catalog-boundary:
          files:
            - "**/internal/catalog/service/**"
            - "**/internal/catalog/ports/**"
            - "**/internal/catalog/adapters/handler/**"
            - "**/internal/catalog/adapters/persistence/**"
            - "**/internal/catalog/adapters/storage/**"
          deny:
            - pkg: altune/go-api/internal/discovery
              desc: catalog reaches discovery only through adapters/discoverybridge (internal/catalog/CLAUDE.md)
            - pkg: altune/go-api/internal/playback
              desc: catalog never imports playback (internal/catalog/CLAUDE.md)
            - pkg: altune/go-api/internal/admin
              desc: catalog never imports admin (internal/catalog/CLAUDE.md)

        acquisition-boundary:
          files:
            - "**/internal/acquisition/service/**"
            - "**/internal/acquisition/ports/**"
            - "**/internal/acquisition/adapters/ytdlp/**"
            - "**/internal/acquisition/adapters/id3/**"
            - "**/internal/acquisition/adapters/ytmusic/**"
            - "**/internal/acquisition/adapters/streamrip/**"
            - "**/internal/acquisition/adapters/chromaprint/**"
            - "**/internal/acquisition/adapters/handler/**"
          deny:
            - pkg: altune/go-api/internal/discovery
              desc: acquisition reaches discovery only through adapters/discoverybridge (internal/acquisition/CLAUDE.md)
            - pkg: altune/go-api/internal/playback
              desc: acquisition never imports playback (internal/acquisition/CLAUDE.md)
            - pkg: altune/go-api/internal/admin
              desc: acquisition never imports admin (internal/acquisition/CLAUDE.md)

        shared-bottom:
          files:
            - "**/internal/shared/**"
          deny:
            - pkg: altune/go-api/internal/acquisition
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/admin
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/app
              desc: internal/shared never imports the composition root
            - pkg: altune/go-api/internal/auth
              desc: internal/shared never imports auth
            - pkg: altune/go-api/internal/catalog
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/discovery
              desc: internal/shared never imports feature packages
            - pkg: altune/go-api/internal/playback
              desc: internal/shared never imports feature packages

        # Inward layer direction within a feature (structure audit F1, second
        # axis): the application layer orchestrates the domain through ports and
        # must never reach into an adapter. Verified clean today; kept blocking.
        layer-service-inward:
          files:
            - "**/internal/*/service/**"
          deny:
            - pkg: altune/go-api/internal/catalog/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/discovery/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/playback/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/feedback/adapters
              desc: service is driven by ports, it never imports adapters
            - pkg: altune/go-api/internal/acquisition/adapters
              desc: service is driven by ports, it never imports adapters

        # Ports declare interfaces in terms of the domain only: no service, no
        # adapters. This keeps the port surface a pure contract.
        layer-ports-inward:
          files:
            - "**/internal/*/ports/**"
          deny:
            - pkg: altune/go-api/internal/catalog/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/discovery/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/playback/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/feedback/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/acquisition/service
              desc: ports are pure contracts, they never import the service
            - pkg: altune/go-api/internal/catalog/adapters
              desc: ports are pure contracts, they never import adapters
            - pkg: altune/go-api/internal/discovery/adapters
              desc: ports are pure contracts, they never import adapters
            - pkg: altune/go-api/internal/playback/adapters
              desc: ports are pure contracts, they never import adapters
            - pkg: altune/go-api/internal/feedback/adapters
              desc: ports are pure contracts, they never import adapters
            - pkg: altune/go-api/internal/acquisition/adapters
              desc: ports are pure contracts, they never import adapters
