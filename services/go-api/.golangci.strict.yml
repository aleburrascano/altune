version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - errorlint
    - bodyclose
    - unconvert
    - nilerr
    - misspell
    - cyclop
    - gocognit
    - dupl
    - funlen
    - revive

  settings:
    cyclop:
      max-complexity: 15
      package-average: 0.0
    gocognit:
      min-complexity: 20
    dupl:
      threshold: 150
    funlen:
      lines: 20
      statements: 20
      ignore-comments: true
    revive:
      rules:
        - name: indent-error-flow
        - name: superfluous-else
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - unnamedResult

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocognit
          - cyclop
          - errcheck
          - gocritic
          - funlen
          - revive
      - path: (cmd/|/eval/|/catalogtest/)
        linters:
          - dupl
          - gocognit
          - cyclop
          - funlen

formatters:
  enable:
    - gofumpt
