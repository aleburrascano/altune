version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - errorlint
    - bodyclose
    - unconvert
    - nilerr
    - misspell
    - dupl
    - revive
    - sloglint
    - forbidigo
    - depguard
    - testpackage
    - nilnil
    - exhaustive
    - noctx
    - errchkjson
    - errname
    - gochecknoinits
    - usestdlibvars
    - musttag
    - usetesting
    - rowserrcheck
    - nilnesserr
    - durationcheck
    - spancheck

