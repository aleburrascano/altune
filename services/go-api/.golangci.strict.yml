version: "2"

run:
  build-tags:
    - tools

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - errorlint
    - bodyclose
    - unconvert
    - nilerr
    - misspell
    - dupl
    - revive
    - sloglint
    - forbidigo
    - testpackage
    - nilnil
    - exhaustive
    - noctx
    - errchkjson
    - errname
    - gochecknoinits
    - usestdlibvars
    - musttag
    - usetesting
    - rowserrcheck
    - nilnesserr
    - durationcheck
    - spancheck
    - depguard
    - importas
    - contextcheck

  settings:
    importas:
      no-unaliased: false
      no-extra-aliases: false
      alias:
        - pkg: net/http
          alias: http
    exhaustive:
      default-signifies-exhaustive: true
    rowserrcheck:
      packages:
        - github.com/jackc/pgx/v5
    depguard:
      rules:
        layer:
          list-mode: lax
          files:
            - "**/internal/**/core/**"
            - "**/internal/**/service/**"
            - "**/internal/**/domain/**"
            - "**/internal/**/ports/**"
            - "**/internal/**/shell/**"
            - "!$test"
          deny:
            - pkg: os
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
            - pkg: os/exec
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
            - pkg: io/fs
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
            - pkg: net
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
            - pkg: net/http
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
            - pkg: database/sql
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
            - pkg: github.com/jackc/pgx
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
            - pkg: github.com/redis
              desc: core, service, domain, ports and shell stay pure, so do I/O in an adapters package
        driver:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!$test"
            - "!**/adapters/**"
            - "!**/internal/shared/database/**"
            - "!**/internal/shared/dbtest/**"
            - "!**/cmd/**"
            - "!**/internal/app/*.go"
            - "!**/internal/app/downloadsetup/**"
            - "!**/internal/app/shutdown/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: the database driver is imported only in its home, an adapters package, shared/database, shared/dbtest or the composition root, so reach the database through one of them
        composition:
          list-mode: lax
          files:
            - "**/cmd/**"
            - "**/internal/app/*.go"
            - "**/internal/app/downloadsetup/**"
            - "**/internal/app/shutdown/**"
            - "!$test"
          allow:
            - github.com/jackc/pgx/v5/pgxpool
          deny:
            - pkg: github.com/jackc/pgx
              desc: the composition root, its home for the driver, names only the pool type pgxpool, so reach everything else through shared/database
        random:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/shared/random/**"
          deny:
            - pkg: math/rand
              desc: math/rand is drawn only in its home, shared/random
    dupl:
      threshold: 150
    sloglint:
      context: scope
      no-mixed-args: false
    testpackage:
      skip-regexp: ^$
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.Error$
          msg: write the error through httpserver.HandleServiceError
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv|Setenv|Unsetenv)$
          msg: read settings once in internal/shared/config and pass them in
        - pattern: ^exec\.(Command|CommandContext)$
          msg: start a child process through childprocess.Run (internal/shared/childprocess), which kills the whole process group on cancel and caps the output
        - pattern: ^slog\.(Debug|Info|Warn|Error)$
          msg: log with the request's context (slog.InfoContext(ctx, ...)) so the correlation id reaches the line
        - pattern: ^slog\.SetDefault$
          msg: install or swap the default logger through logging.Setup or logging.Swap (internal/shared/logging), the one home for logger configuration
        - pattern: ^recover$
          msg: recover a panic through background.SafeRun or background.RecoverContext (internal/shared/background), the one panic guard
        - pattern: ^sync\.WaitGroup$
          msg: run a bounded fan-out through parallel.Limited (internal/shared/parallel), fire-and-forget work through background.Tracker, and wait with a deadline through background.WaitWithin (internal/shared/background)
        - pattern: ^http\.(Get|Head|Post|PostForm|DefaultClient|DefaultTransport)$
          msg: build a client with outbound.NewClient and take the shared transport from outbound.DefaultTransport (internal/platform/outbound), the one home for outbound HTTP
        - pattern: ^context\.WithoutCancel$
          msg: outlive a request through background.Detach(ctx, budget) (internal/shared/background), which keeps the request's values and sets its own deadline
        - pattern: ^context\.(Background|TODO)$
          msg: take the caller's ctx; a context root belongs to a main package (cmd, scripts), and work that outlives the request goes through background.Detach (internal/shared/background)
        - pattern: ^time\.(Now|Since|Until|After|AfterFunc|NewTimer|NewTicker|Tick)$
          msg: take the clock as a clock.Func parameter and read it through clock.Now at the composition root (internal/shared/clock), the one home for time
    revive:
      rules:
        - name: indent-error-flow
        - name: superfluous-else
        - name: deep-exit
        - name: flag-parameter
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - unnamedResult
      settings:
        ruleguard:
          rules: ${base-path}/_rules/*.rules

  exclusions:
    generated: lax
    paths:
      - node_modules/
    rules:
      - path: _test\.go
        linters:
          - contextcheck
          - dupl
          - errcheck
          - gocritic
          - revive
          - forbidigo
          - noctx
      - path: internal/shared/httpserver/
        linters:
          - forbidigo
        text: 'use of `(http\.\w+|recover)`'
      - path: (^internal/platform/outbound/|/[^/]*test/)
        linters:
          - forbidigo
        text: 'use of `http\.'
      - path: internal/shared/(background|parallel)/
        linters:
          - forbidigo
        text: 'use of `(recover|sync\.WaitGroup|context\.WithoutCancel)` forbidden'
      - path: (^internal/shared/clock/|/[^/]*test/)
        linters:
          - forbidigo
        text: 'use of `time\.'
      - path: ^(internal/shared/(config|dbtest)/|cmd/|scripts/)
        linters:
          - forbidigo
        text: internal/shared/config
      - path: ^(cmd|scripts)/|/[^/]*test/
        linters:
          - forbidigo
        text: 'use of `context\.(Background|TODO)`'
      - path: /[^/]*test/
        linters:
          - contextcheck
      - path: ^(internal/shared/childprocess/|scripts/)|/[^/]*test/
        linters:
          - forbidigo
        text: 'use of `exec\.'
      - path: ^internal/shared/logging/|/[^/]*test/
        linters:
          - forbidigo
        text: 'use of `slog\.SetDefault`'
      - linters:
          - sloglint
        text: DiscardHandler
      - path: (cmd/api/main\.go|/qualitycheck/|/librarytest/)
        linters:
          - dupl

formatters:
  enable:
    - gofumpt
