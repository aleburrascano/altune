        shared:
          files: ["**/internal/shared/**"]
          deny:
            - pkg: altune/go-api/internal/acquisition
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
            - pkg: altune/go-api/internal/auth
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
            - pkg: altune/go-api/internal/catalog
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
            - pkg: altune/go-api/internal/discovery
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
            - pkg: altune/go-api/internal/eventstream
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
            - pkg: altune/go-api/internal/observe
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
            - pkg: altune/go-api/internal/playback
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
            - pkg: altune/go-api/internal/app
              desc: a shared module never imports a feature or internal/app (read internal/README.md)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.Error$
          msg: write the error through httputil.HandleServiceError
        - pattern: ^httputil\.(BadRequest|NotFound|InternalError)$
          msg: answer with a shared/domain coded error through httputil.HandleServiceError, the one error writer (internal/shared/httputil/README.md)
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read settings once in internal/shared/config and pass them in
        - pattern: ^recover$
          msg: recover a panic through runloop.Try or runloop.RecoverContext (internal/shared/runloop), the one panic guard
        - pattern: ^sync\.WaitGroup$
          msg: run a bounded fan-out through fanout.Group (internal/shared/fanout), fire-and-forget work through runloop.Tracker, and wait with a deadline through runloop.WaitWithin (internal/shared/runloop)
        - pattern: ^context\.WithoutCancel$
          msg: outlive a request through runloop.Detach(ctx, budget) (internal/shared/runloop), which keeps the request's values and sets its own deadline
    funlen:
      lines: 20
      statements: 20
      ignore-comments: true
    revive:
      rules:
        - name: indent-error-flow
        - name: superfluous-else
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - unnamedResult

  exclusions:
    generated: lax
    paths:
      - node_modules/
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocognit
          - cyclop
          - errcheck
          - gocritic
          - funlen
          - revive
          - forbidigo
      - path: internal/shared/httputil/
        linters:
          - forbidigo
      - path: internal/shared/(runloop|fanout)/
        linters:
          - forbidigo
        text: 'use of `(recover|sync\.WaitGroup|context\.WithoutCancel)` forbidden'
      - path: ^(internal/shared/(config|sharedtest)/|cmd/|scripts/)
        linters:
          - forbidigo
        text: internal/shared/config
      - linters:
          - sloglint
        text: DiscardHandler
      - path: (cmd/(api/main\.go|discoveryeval/)|/eval/|/catalogtest/)
        linters:
          - dupl
          - gocognit
          - cyclop
          - funlen

formatters:
  enable:
    - gofumpt
