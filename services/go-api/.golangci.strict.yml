version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - errorlint
    - bodyclose
    - unconvert
    - nilerr
    - misspell
    - cyclop
    - gocognit
    - dupl
    - funlen
    - revive
    - sloglint
    - forbidigo
    - depguard
    - testpackage

  settings:
    cyclop:
      max-complexity: 15
      package-average: 0.0
    gocognit:
      min-complexity: 20
    dupl:
      threshold: 150
    sloglint:
      context: scope
      no-mixed-args: false
    testpackage:
      skip-regexp: ^$
    depguard:
      rules:
        feature-acquisition:
          files: ["**/internal/acquisition/**"]
          deny:
