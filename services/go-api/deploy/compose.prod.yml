name: go-api

x-go-api: &go-api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  restart: unless-stopped
  stop_grace_period: 90s
  env_file:
    - ../.env.production
  environment:
    - EVAL_METER_ENABLED=true
  volumes:
    - ../../../cookies.txt:/data/cookies.txt
    - ../../../streamrip.toml:/home/altune/.config/streamrip/config.toml
  tmpfs:
    - /tmp:size=1G
  depends_on:
    redis:
      condition: service_healthy

services:
  go-api-blue:
    <<: *go-api
    image: altune-go-api:blue
    container_name: altune-go-api-blue

  go-api-green:
    <<: *go-api
    image: altune-go-api:green
    container_name: altune-go-api-green

  overseer:
    build:
      context: ../../overseer
      dockerfile: Dockerfile
    image: altune-overseer:latest
    container_name: altune-overseer
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      - OVERSEER_ENV=production
    volumes:
      - overseer-data:/var/lib/overseer
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: altune-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: altune-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "8081"
      - "8082"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/upstream.conf:/etc/caddy/upstream.conf:ro
      - ./caddy/staging-upstream.conf:/etc/caddy/staging-upstream.conf:ro
      - ../../../../altune-web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  overseer-data:
