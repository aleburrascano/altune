name: go-api

x-go-api: &go-api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file:
    - ../.env.production
  environment:
    # OPERATOR_READONLY_USER_ID (overseer's read-only admin principal, #1810) is
    # NOT pinned here: it is a per-project service account, so it comes from
    # ../.env.production with the rest of the secrets.
    - OPERATOR_USER_ID=955fca87-3a19-415f-b9b8-c9b934b39524
    - EVAL_METER_ENABLED=true
  volumes:
    - /home/ubuntu/altune/cookies.txt:/data/cookies.txt
    - /home/ubuntu/altune/streamrip.toml:/home/altune/.config/streamrip/config.toml
  tmpfs:
    - /tmp:size=1G
  depends_on:
    redis:
      condition: service_healthy

services:
  go-api-blue:
    <<: *go-api
    image: altune-go-api:blue
    container_name: altune-go-api-blue

  go-api-green:
    <<: *go-api
    image: altune-go-api:green
    container_name: altune-go-api-green

  # Overseer runs as its own container with no dependency on go-api, so it
  # outlives go-api restarts (blue-green only touches the go-api-* services) and
  # keeps serving /health plus each bucket's last-known state while the app is
  # down. Owner-only is enforced inside Overseer via OVERSEER_OWNER_USER_ID
  # (set in ../.env.production). It reads go-api at OVERSEER_GOAPI_URL
  # (../.env.production), which should be http://altune-caddy:8081: Caddy's
  # internal listener that follows the blue/green upstream on the Docker network.
  overseer:
    build:
      context: ../../overseer
      dockerfile: Dockerfile
    image: altune-overseer:latest
    container_name: altune-overseer
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      - OVERSEER_ENV=production
    # Persist the rotating read-only refresh token across restarts. Supabase spends
    # the seed on first use, so without this every restart replays a dead token and
    # has to fall back to a fresh password sign-in.
    volumes:
      - overseer-data:/var/lib/overseer
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: altune-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: altune-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Internal-only go-api listeners for overseer (Caddyfile): 8081 follows prod's
    # upstream.conf, 8082 staging's. Never add them to ports.
    expose:
      - "8081"
      - "8082"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/upstream.conf:/etc/caddy/upstream.conf:ro
      # Staging site block (Caddyfile) imports this; the staging stack's
      # blue-green rewrites it. Mounted here because prod's Caddy owns 80/443
      # and serves both tiers (epic #1488). Without the mount the import fails
      # and Caddy refuses to start.
      - ./caddy/staging-upstream.conf:/etc/caddy/staging-upstream.conf:ro
      - /home/ubuntu/altune-web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  overseer-data:
