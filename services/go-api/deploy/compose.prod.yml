name: go-api

x-go-api: &go-api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file:
    - ../.env.production
  environment:
    - OPERATOR_USER_ID=955fca87-3a19-415f-b9b8-c9b934b39524
    - EVAL_METER_ENABLED=true
    - SUPABASE_ANON_KEY=sb_publishable_aAtjkl3gujVDjTRKWp4q0A_Y17qqnaN
  volumes:
    - /home/ubuntu/altune/cookies.txt:/data/cookies.txt
    - /home/ubuntu/altune/streamrip.toml:/home/altune/.config/streamrip/config.toml
  tmpfs:
    - /tmp:size=1G
  depends_on:
    redis:
      condition: service_healthy

services:
  go-api-blue:
    <<: *go-api
    image: altune-go-api:blue
    container_name: altune-go-api-blue

  go-api-green:
    <<: *go-api
    image: altune-go-api:green
    container_name: altune-go-api-green

  # Overseer runs as its own container with no dependency on go-api, so it
  # outlives go-api restarts (blue-green only touches the go-api-* services) and
  # keeps serving /health plus each bucket's last-known state while the app is
  # down. Owner-only is enforced inside Overseer via OVERSEER_OWNER_TOKEN
  # (set in ../.env.production).
  overseer:
    build:
      context: ../../overseer
      dockerfile: Dockerfile
    image: altune-overseer:latest
    container_name: altune-overseer
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      - OVERSEER_ENV=production
    # Persist the rotating operator refresh token across restarts. Supabase spends
    # the seed on first use, so without this a restart replays a dead token and
    # every go-api-backed bucket degrades to source_down until a manual reseed.
    volumes:
      - overseer-data:/var/lib/overseer
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: altune-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: altune-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/upstream.conf:/etc/caddy/upstream.conf:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  overseer-data:
