name: staging

x-go-api: &go-api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  restart: unless-stopped
  stop_grace_period: 90s
  env_file:
    - ../.env.staging
  environment:
    - EVAL_METER_ENABLED=false
  volumes:
    - ../../../cookies.txt:/data/cookies.txt:ro
    - ../../../streamrip.toml:/home/altune/.config/streamrip/config.toml:ro
  tmpfs:
    - /tmp:size=512m
  mem_limit: 1g
  cpus: 1.0
  networks:
    - staging
    - edge
  depends_on:
    redis:
      condition: service_healthy

services:
  go-api-blue:
    <<: *go-api
    image: altune-staging-go-api:blue
    container_name: altune-staging-go-api-blue

  go-api-green:
    <<: *go-api
    image: altune-staging-go-api:green
    container_name: altune-staging-go-api-green

  overseer:
    build:
      context: ../../overseer
      dockerfile: Dockerfile
    image: altune-staging-overseer:latest
    container_name: altune-staging-overseer
    restart: unless-stopped
    env_file:
      - ../.env.staging
    environment:
      - OVERSEER_ENV=staging
    volumes:
      - overseer-data:/var/lib/overseer
    expose:
      - "8090"
    mem_limit: 256m
    cpus: 0.5
    networks:
      - staging
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: altune-staging-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 320m
    cpus: 0.5
    networks:
      - staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  staging:
    name: altune-staging
  edge:
    external: true
    name: go-api_default

volumes:
  overseer-data:
