name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test-mobile.yml

  build-staging:
    needs: [test]
    concurrency:
      group: deploy-web-staging-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      entry: ${{ steps.pack.outputs.entry }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      - name: expo web export
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: npx expo export -p web
      - name: Every inline script is allowed by the staging CSP
        run: bash "$GITHUB_WORKSPACE/.github/workflows/deploy-web-csp-check.sh"
      - name: Pack the release
        id: pack
        run: bash "$GITHUB_WORKSPACE/.github/workflows/deploy-web-pack.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: web-staging-${{ github.sha }}
          path: web-release/
          retention-days: 7

  deploy-staging:
    needs: [build-staging]
    concurrency:
      group: deploy-web-staging-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Verify deploy secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/workflows/require-secrets.sh DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY

      - uses: actions/download-artifact@v8
        with:
          name: web-staging-${{ github.sha }}
          path: web-release

      - name: Copy the release to the VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: web-release/web.tgz,web-release/web-release.sh
          target: altune-web-incoming/${{ github.sha }}
          strip_components: 1

      - name: Flip staging onto the release over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            incoming=~/altune-web-incoming/${{ github.sha }}
            bash "$incoming/web-release.sh" staging ${{ github.sha }} "$incoming/web.tgz"
            rm -rf "$incoming"

  smoke-staging:
    needs: [build-staging, deploy-staging]
    concurrency:
      group: deploy-web-staging-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Staging serves the new web release and still routes the API
        env:
          BASE_URL: ${{ vars.STAGING_API_URL }}
          ENTRY: ${{ needs.build-staging.outputs.entry }}
          SHA: ${{ github.sha }}
        run: bash .github/workflows/deploy-web-smoke.sh

  approve-prod:
    needs: [smoke-staging]
    concurrency:
      group: deploy-web-prod-approval
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record the approved commit
        env:
          SHA: ${{ github.sha }}
        run: echo "Prod web promotion approved for $SHA."

  build-prod:
    needs: [approve-prod]
    concurrency:
      group: deploy-web-prod-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      entry: ${{ steps.pack.outputs.entry }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      - name: expo web export
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
        run: npx expo export -p web
      - name: Every inline script is allowed by the prod CSP
        run: bash "$GITHUB_WORKSPACE/.github/workflows/deploy-web-csp-check.sh"
      - name: Pack the release
        id: pack
        run: bash "$GITHUB_WORKSPACE/.github/workflows/deploy-web-pack.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: web-prod-${{ github.sha }}
          path: web-release/
          retention-days: 7

  deploy-prod:
    needs: [build-prod]
    concurrency:
      group: deploy-web-prod-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Verify deploy secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/workflows/require-secrets.sh DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY

      - uses: actions/download-artifact@v8
        with:
          name: web-prod-${{ github.sha }}
          path: web-release

      - name: Copy the release to the VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: web-release/web.tgz,web-release/web-release.sh
          target: altune-web-incoming/${{ github.sha }}
          strip_components: 1

      - name: Flip prod onto the release over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            incoming=~/altune-web-incoming/${{ github.sha }}
            bash "$incoming/web-release.sh" prod ${{ github.sha }} "$incoming/web.tgz"
            rm -rf "$incoming"

  smoke-prod:
    needs: [build-prod, deploy-prod]
    concurrency:
      group: deploy-web-prod-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Prod serves the new web release and still routes the API
        env:
          BASE_URL: ${{ vars.PROD_API_URL }}
          ENTRY: ${{ needs.build-prod.outputs.entry }}
          SHA: ${{ github.sha }}
        run: bash .github/workflows/deploy-web-smoke.sh
