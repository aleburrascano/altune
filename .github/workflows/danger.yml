name: danger

# PR-shape gate: posts one updating comment with any issues (missing "Closes
# #", no description, source-without-test, oversized diff). Advisory unless
# added to branch protection as a required check.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Danger
        run: npx --yes danger@12 ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ github.token }}
