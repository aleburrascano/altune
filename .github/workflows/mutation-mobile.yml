name: Mutation (mobile)

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      mutate:
        description: 'Glob to mutate, overriding stryker.config.json (e.g. src/shared/playback/**/*.ts)'
        required: false

concurrency:
  group: mutation-mobile
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - name: mutation test
        env:
          MUTATE: ${{ github.event.inputs.mutate }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/mutation-mobile.sh"

      - name: upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: apps/mobile/reports/mutation/
          if-no-files-found: warn
          retention-days: 30
