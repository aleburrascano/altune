name: Test overseer

on:
  workflow_call:

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/overseer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/overseer/go.mod
          cache-dependency-path: services/overseer/go.sum
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: no new comments on changed code (diff-scoped)
        working-directory: services/go-api
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT" = "merge_group" ] && [ -n "$MERGE_BASE" ]; then
            BASE="$MERGE_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            echo "::error::no usable diff base ($EVENT)"
            exit 1
          fi
          echo "Diff base: $BASE"
          go run ./scripts/lintcomments "$BASE" ../overseer
      - name: no comments (whole tree)
        working-directory: services/go-api
        run: go run ./scripts/lintcomments --all ../overseer
      - name: strict linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: services/overseer
          args: --config ${{ github.workspace }}/services/go-api/.golangci.strict.yml --disable=funlen,revive
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: nilaway ceiling
        run: bash "$GITHUB_WORKSPACE/.github/workflows/nilaway-ceiling.sh"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/overseer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/overseer/go.mod
          cache-dependency-path: services/overseer/go.sum
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/overseer/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/overseer/web/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: no new comments on changed code (diff-scoped)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT" = "merge_group" ] && [ -n "$MERGE_BASE" ]; then
            BASE="$MERGE_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            echo "::error::no usable diff base ($EVENT)"
            exit 1
          fi
          echo "Diff base: $BASE"
          node scripts/lint-changed-comments.mjs "$BASE"
      - name: test
        run: npm run test
      - name: build
        run: npm run build
      - name: bundle budget
        run: npm run size
