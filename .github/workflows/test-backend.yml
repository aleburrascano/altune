name: Test backend

on:
  workflow_call:

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum
      - name: go vet (incl. integration test files)
        run: go vet ./...
      - name: import direction (depguard)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: services/go-api
      - name: strict linters (new code only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: services/go-api
          args: --config .golangci.strict.yml
          only-new-issues: true
      - name: no new comments on changed code (diff-scoped)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT" = "merge_group" ] && [ -n "$MERGE_BASE" ]; then
            BASE="$MERGE_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            echo "::error::no usable diff base ($EVENT)"
            exit 1
          fi
          echo "Diff base: $BASE"
          go run ./scripts/lintcomments "$BASE"
      - name: no comments (whole tree)
        run: go run ./scripts/lintcomments --all .
      - name: no new vague identifier names on changed code (diff-scoped)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-backend-diff-lint.sh" names
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: nilaway ceiling
        run: bash "$GITHUB_WORKSPACE/.github/workflows/nilaway-ceiling.sh" nilaway-baseline.txt

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-api
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck deploy scripts
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-backend-shellcheck.sh"
      - name: deploy smoke self-test
        run: bash deploy/smoke_test.sh
      - name: web release self-test
        run: bash deploy/web-release_test.sh
      - name: release self-test
        run: bash deploy/release_test.sh
      - name: blue-green self-test
        run: bash deploy/blue-green_test.sh
      - name: staging deploy self-test
        run: bash deploy/staging_test.sh
      - name: prod migrate self-test
        run: bash deploy/prod-migrate_test.sh
      - name: migration safety self-test
        run: bash deploy/migration-safety_test.sh
      - name: migration safety check
        run: bash deploy/migration-safety.sh
      - name: overseer deploy self-test
        run: bash deploy/overseer_test.sh
      - name: caddy routing test (real caddy image)
        run: bash deploy/caddy-routing_test.sh
      - name: staging sync test (real postgres image)
        run: bash deploy/staging-sync_test.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum
      - name: promote-staging test (real postgres image)
        run: bash deploy/promote-staging_test.sh
      - name: deploy workflow self-test
        working-directory: .
        run: bash .github/workflows/deploy-backend_test.sh
      - name: uptime probe self-test
        working-directory: .
        run: |
          bash scripts/uptime/journey_test.sh
          bash scripts/uptime/check_test.sh

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: altune
          POSTGRES_PASSWORD: altune_dev
          POSTGRES_DB: altune
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U altune -d altune"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://altune:altune_dev@localhost:5432/altune?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum

      - name: apply migrations
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-backend-migrate.sh"

      - name: go test -race (incl. integration tests)
        env:
          CGO_ENABLED: "1"
          INTEGRATION: "1"
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: integration tests run
        env:
          INTEGRATION: "1"
        run: go test -count=1 -v -run 'TestPgxSearchHistoryRepo' ./internal/discovery/adapters/persistence/

      - name: acquisition selection gate
        run: go run ./cmd/acquisitioneval -baseline ./cmd/acquisitioneval/baselines.json

      - name: coverage ratchet
        env:
          MIN: 65
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-backend-coverage.sh"
