
name: PR gate

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.all.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile || steps.all.outputs.mobile }}
      overseer: ${{ steps.filter.outputs.overseer || steps.all.outputs.overseer }}
    steps:
      - id: all
        if: ${{ github.event_name == 'merge_group' }}
        run: printf 'backend=true\nmobile=true\noverseer=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            backend:
              - 'services/go-api/**'
              - '.github/workflows/test-backend*'
              - '.github/workflows/nilaway-ceiling.sh'
              - '.github/workflows/deploy-backend*'
              - '.github/workflows/deploy-web*'
              - 'scripts/uptime/**'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/test-mobile*'
              - '.github/actions/mobile-setup/**'
            overseer:
              - 'services/overseer/**'
              - '.github/workflows/test-overseer.yml'
              - '.github/workflows/nilaway-ceiling.sh'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/test-backend.yml

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    uses: ./.github/workflows/test-mobile.yml

  overseer:
    needs: changes
    if: ${{ needs.changes.outputs.overseer == 'true' }}
    uses: ./.github/workflows/test-overseer.yml

  cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Build the module graph
        run: node_modules/.bin/graft build
      - name: Fail on any dependency cycle
        run: node scripts/check-cycles.mjs

  test-home:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression suite for the check
        run: bash scripts/test-home.test.sh
      - name: Fail on a test file that belongs in its unit's test file
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/workflows/pr-gate-test-home.sh

  gate:
    needs: [backend, mobile, overseer, cycles, test-home]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Assert applicable suites passed
        env:
          BACKEND: ${{ needs.backend.result }}
          MOBILE: ${{ needs.mobile.result }}
          OVERSEER: ${{ needs.overseer.result }}
          CYCLES: ${{ needs.cycles.result }}
          TEST_HOME: ${{ needs['test-home'].result }}
        run: bash .github/workflows/pr-gate-assert.sh
