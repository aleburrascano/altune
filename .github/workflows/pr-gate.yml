# Single required check for main. Path-filtered CI (test-backend, test-mobile)
# cannot be required directly: a PR that doesn't touch a path never runs that
# workflow, and a required check that never runs leaves the PR stuck pending
# forever. This gate always runs on every PR to main, calls only the reusable
# suites whose paths changed, and ends in one `gate` job that is the branch's
# sole required status check.
#
# It also runs on `merge_group`, so the same single `gate` context satisfies
# GitHub's merge queue. In the queue we run BOTH suites (the batched commit can
# touch either side), skipping the path filter — correctness over a few saved
# minutes on the rare queue build.
#
# The reusable suites (test-backend, test-mobile) are ONLY reachable through this
# gate on a PR — their own `pull_request` triggers were removed so they no longer
# run a second, unprefixed copy that shares a concurrency group with the called
# copy and cancels it mid-run (the "gate never finalizes" stall).

name: PR gate

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.all.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile || steps.all.outputs.mobile }}
      overseer: ${{ steps.filter.outputs.overseer || steps.all.outputs.overseer }}
    steps:
      # In the merge queue there is no PR base to diff against, and the batched
      # commit may touch any side — so select every suite and skip the filter.
      - id: all
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "mobile=true" >> "$GITHUB_OUTPUT"
          echo "overseer=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            backend:
              - 'services/go-api/**'
              - '.github/workflows/test-backend.yml'
              # test-backend's `smoke` job self-tests deploy-backend.yml; without
              # this a deploy-workflow-only PR runs no suite at all (#1807).
              - '.github/workflows/deploy-backend*'
              - '.github/workflows/deploy-web*'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/test-mobile.yml'
              - '.github/actions/mobile-setup/**'
            overseer:
              - 'services/overseer/**'
              - '.github/workflows/test-overseer.yml'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/test-backend.yml

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    uses: ./.github/workflows/test-mobile.yml

  overseer:
    needs: changes
    if: ${{ needs.changes.outputs.overseer == 'true' }}
    uses: ./.github/workflows/test-overseer.yml

  cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Build the module graph
        run: node_modules/.bin/graft build
      - name: Fail on any dependency cycle
        run: node scripts/check-cycles.mjs

  # A test file belongs to the unit it tests: fail a PR that adds a per-bug or
  # per-scenario test file for a unit that already has one, or names none.
  test-home:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression suite for the check
        run: bash scripts/test-home.test.sh
      - name: Fail on a test file that belongs in its unit's test file
        run: |
          set +e
          node scripts/test-home.mjs origin/${{ github.base_ref }}
          rc=$?
          if [ "$rc" -eq 3 ]; then echo "::warning::test-home could not run; not blocking"; exit 0; fi
          exit "$rc"

  gate:
    needs: [backend, mobile, overseer, cycles, test-home]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert applicable suites passed
        env:
          BACKEND: ${{ needs.backend.result }}
          MOBILE: ${{ needs.mobile.result }}
          OVERSEER: ${{ needs.overseer.result }}
          CYCLES: ${{ needs.cycles.result }}
          TEST_HOME: ${{ needs['test-home'].result }}
        run: |
          fail=0
          for name in BACKEND MOBILE OVERSEER CYCLES TEST_HOME; do
            result="${!name}"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *) echo "$name gate did not pass: $result"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "all applicable suites passed"
