name: Discovery eval nightly

on:
  workflow_dispatch:

concurrency:
  group: discovery-eval
  cancel-in-progress: false

env:
  CORPUS: cmd/discoveryeval/corpus-library.json

jobs:
  heavy:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [eval, merge, diversity, artist-intent, signal-b]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: services/go-api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_JWT_JWKS_URL: ${{ secrets.SUPABASE_JWT_JWKS_URL }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
      GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
      MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum
      - name: build harness
        run: go build -o ./tmp/discoveryeval ./cmd/discoveryeval

      - name: ${{ matrix.mode }}
        env:
          MODE: ${{ matrix.mode }}
          RETRY_DELAY: 60
        run: bash "$GITHUB_WORKSPACE/.github/workflows/discovery-eval-mode.sh"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: discovery-eval-${{ matrix.mode }}
          path: services/go-api/tmp/*-${{ matrix.mode }}.json
          retention-days: 30

  cheap:
    strategy:
      fail-fast: false
      matrix:
        mode: [detail, correction, signal-a]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/go-api
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_JWT_JWKS_URL: ${{ secrets.SUPABASE_JWT_JWKS_URL }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
      GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
      MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum
      - name: build harness
        run: go build -o ./tmp/discoveryeval ./cmd/discoveryeval

      - name: seed vocabulary
        if: matrix.mode == 'correction'
        env:
          REDIS_URL: redis://localhost:6379
        run: ./tmp/discoveryeval -mode correction-seed -corpus-file "$CORPUS"

      - name: ${{ matrix.mode }}
        env:
          REDIS_URL: ${{ matrix.mode == 'correction' && 'redis://localhost:6379' || '' }}
          MODE: ${{ matrix.mode }}
          RETRY_DELAY: 20
        run: bash "$GITHUB_WORKSPACE/.github/workflows/discovery-eval-mode.sh"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: discovery-eval-${{ matrix.mode }}
          path: services/go-api/tmp/*-${{ matrix.mode }}.json
          retention-days: 30

  report:
    needs: [heavy, cheap]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/go-api
    env:
      SUPABASE_JWT_JWKS_URL: ${{ secrets.SUPABASE_JWT_JWKS_URL }}
      MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum

      - uses: actions/download-artifact@v8
        with:
          path: services/go-api/tmp/reports
          pattern: discovery-eval-*
          merge-multiple: true

      - name: aggregate
        id: aggregate
        run: bash "$GITHUB_WORKSPACE/.github/workflows/discovery-eval-report.sh"
