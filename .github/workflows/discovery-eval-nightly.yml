# Discovery nightly eval — the ACTUAL baselines gate.
#
# discovery-eval-gate.yml runs only the deterministic, provider-free unit tests
# per-PR. This workflow runs every gated mode against the frozen corpus and
# reports each metric against cmd/discoveryeval/baselines.json.
#
# Why the corpus is frozen, why the modes are split into two groups, and what a
# metric delta means: okf/backend/discovery/eval-harness.md.
#
# Repo secrets required:
#   DATABASE_URL        (Supabase Postgres — identity store + metric history)
#   SUPABASE_JWT_JWKS_URL                (config.Load() validates this even though
#                                         eval mode never touches auth)
#   LASTFM_API_KEY, DISCOGS_TOKEN, FANARTTV_API_KEY, GENIUS_ACCESS_TOKEN
#                       (dedicated CI-only credentials — a heavy nightly run
#                        shares no quota with live user traffic. Rotate
#                        independently of prod.)
#   MUSICBRAINZ_USER_AGENT   (no key — a contact UA string; rate limiting there
#                             is IP-scoped, so sharing with prod is fine)
#   ALERT_NTFY_URL      (optional — regression push notification)
name: Discovery eval nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: discovery-eval
  cancel-in-progress: false

env:
  CORPUS: cmd/discoveryeval/corpus-library.json

jobs:
  # Modes that sweep the corpus against live providers. max-parallel is 1 by
  # deliberate design, not runner scarcity: the rate limiter in
  # internal/app/live_transport.go is per-process, so two concurrent jobs would
  # double the request rate on the Last.fm and Discogs credentials, whose quotas
  # are per-key. MusicBrainz and iTunes are IP-scoped and would be unaffected.
  heavy:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [eval, merge, diversity, artist-intent, signal-b]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: services/go-api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_JWT_JWKS_URL: ${{ secrets.SUPABASE_JWT_JWKS_URL }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
      GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
      MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum
      - name: build harness
        run: go build -o ./tmp/discoveryeval ./cmd/discoveryeval

      # A regressed mode re-runs once before it counts. Live providers are noisy
      # enough that a single red result is not evidence: detail's contamination
      # guard is fail-open on a MusicBrainz timeout, and a rate-limited response
      # can flip a gate with no code change (observed 2026-07-24: 0 contamination,
      # then 70, same commit, ~30s apart). Two consecutive regressions is signal.
      - name: ${{ matrix.mode }}
        run: |
          for attempt in 1 2; do
            if ./tmp/discoveryeval \
              -mode ${{ matrix.mode }} \
              -corpus-file "$CORPUS" \
              -json ./tmp/report-${{ matrix.mode }}.json \
              -metrics ./tmp/metrics-${{ matrix.mode }}.json; then
              exit 0
            fi
            echo "${{ matrix.mode }} regressed or errored (attempt $attempt/2)"
            sleep 60
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-eval-${{ matrix.mode }}
          path: services/go-api/tmp/*-${{ matrix.mode }}.json
          retention-days: 30

  # Modes that spend no per-key provider quota: correction is offline against a
  # seeded Redis, signal-a reads telemetry, and detail touches only MusicBrainz,
  # which is IP-scoped and so unaffected by a concurrent heavy job on another
  # runner. Safe to run alongside the heavy group. signal-b is NOT here — it
  # fans out over Last.fm, MusicBrainz and Discogs (BuildConsensusProviders).
  cheap:
    strategy:
      fail-fast: false
      matrix:
        mode: [detail, correction, signal-a]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/go-api
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_JWT_JWKS_URL: ${{ secrets.SUPABASE_JWT_JWKS_URL }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
      GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
      MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum
      - name: build harness
        run: go build -o ./tmp/discoveryeval ./cmd/discoveryeval

      # correction hard-requires a populated vocabulary store. The VM's Redis has
      # no public exposure and isn't reachable from Actions, so CI seeds its own
      # from the frozen corpus — deterministic, and gated against a baseline
      # measured the same way.
      - name: seed vocabulary
        if: matrix.mode == 'correction'
        env:
          REDIS_URL: redis://localhost:6379
        run: ./tmp/discoveryeval -mode correction-seed -corpus-file "$CORPUS"

      - name: ${{ matrix.mode }}
        env:
          REDIS_URL: ${{ matrix.mode == 'correction' && 'redis://localhost:6379' || '' }}
        run: |
          for attempt in 1 2; do
            if ./tmp/discoveryeval \
              -mode ${{ matrix.mode }} \
              -corpus-file "$CORPUS" \
              -json ./tmp/report-${{ matrix.mode }}.json \
              -metrics ./tmp/metrics-${{ matrix.mode }}.json; then
              exit 0
            fi
            echo "${{ matrix.mode }} regressed or errored (attempt $attempt/2)"
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-eval-${{ matrix.mode }}
          path: services/go-api/tmp/*-${{ matrix.mode }}.json
          retention-days: 30

  report:
    needs: [heavy, cheap]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/go-api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_JWT_JWKS_URL: ${{ secrets.SUPABASE_JWT_JWKS_URL }}
      MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go-api/go.mod
          cache-dependency-path: services/go-api/go.sum

      - uses: actions/download-artifact@v4
        with:
          path: services/go-api/tmp/reports
          pattern: discovery-eval-*
          merge-multiple: true

      # Renders the table, upserts every metric into discovery_metrics so the
      # trend outlives the 30-day artifact retention, and exits 2 on a regression.
      - name: aggregate
        id: aggregate
        run: |
          set +e
          go run ./cmd/discoveryeval -mode report -reports ./tmp/reports > ./tmp/summary.md
          code=$?
          cat ./tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ./tmp/summary.md
          exit $code

      - name: notify regression
        if: failure()
        env:
          ALERT_NTFY_URL: ${{ secrets.ALERT_NTFY_URL }}
        run: |
          if [ -z "$ALERT_NTFY_URL" ]; then
            exit 0
          fi
          digest=$(cat ./tmp/reports/regressions.txt 2>/dev/null || echo "a gated mode failed to produce metrics")
          curl -s -H "Title: Discovery eval nightly REGRESSED" \
            -d "$digest — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$ALERT_NTFY_URL"
