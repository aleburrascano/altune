# Build an UNSIGNED iOS .ipa for sideloading and publish it as a GitHub Release.
#
# Sideloaders (AltStore / SideStore) re-sign the app on-device with the user's
# own Apple ID, so we ship an unsigned archive — no Apple Developer account or
# signing certificate needed here. macOS runner minutes are free on public repos.
#
# Trigger: push a tag like `v1.0.0`  (git tag v1.0.0 && git push origin v1.0.0)
# or run manually via the Actions tab (provide the version).
#
# After the build, the AltStore source (apps.json on main) is updated so
# existing installs see the new version automatically.

name: Release iOS (sideload)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  # The release gate. test-mobile.yml runs only when a workflow calls it, so
  # without this a tag push matched nothing and every .ipa published here shipped
  # with zero checks — no typecheck, no lint, no tests. This runs them against
  # the tagged commit before anything is built, on a cheap ubuntu runner rather
  # than the macOS one.
  verify:
    uses: ./.github/workflows/test-mobile.yml

  build:
    needs: verify
    # macos-26 ships Xcode 26.5+ (Swift 6.3.x). Older images topped out at Xcode
    # 26.3 (Swift 6.2.x), which rejects the SWIFT_RETURNS_RETAINED annotation on
    # expo-modules-jsi's RuntimeScheduler constructors and fails the archive.
    runs-on: macos-26
    outputs:
      version: ${{ steps.meta.outputs.version }}
      size: ${{ steps.pack.outputs.size }}
    env:
      # Public (publishable) build-time config, inlined into the JS bundle.
      EXPO_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: bash .github/workflows/release-ios-version.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS deps
        working-directory: apps/mobile
        run: npm ci

      - name: Stamp version into app.json
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/release-ios-stamp.sh"

      - name: Expo prebuild (generate native iOS project)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned archive
        working-directory: apps/mobile/ios
        run: bash "$GITHUB_WORKSPACE/.github/workflows/release-ios-build.sh"

      - name: Package .ipa
        id: pack
        run: bash .github/workflows/release-ios-package.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Altune v${{ steps.meta.outputs.version }}
          body: |
            Unsigned iOS build for sideloading (AltStore / SideStore).
            Add the source once, then install/update from there:
            `https://raw.githubusercontent.com/${{ github.repository }}/altstore/apps.json`
          files: ${{ runner.temp }}/Altune.ipa
          fail_on_unmatched_files: true

  # Publishes the AltStore/SideStore manifest to the dedicated, UNPROTECTED
  # `altstore` branch. main stays fully protected — the bot never writes to it.
  update-source:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # main — has the updater script

      - name: Seed working copy with the currently published manifest
        run: |
          git fetch origin altstore
          git show origin/altstore:apps.json > apps.json

      - name: Update AltStore manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIZE: ${{ needs.build.outputs.size }}
          REPO: ${{ github.repository }}
        run: node scripts/update-altstore-source.mjs

      - name: Publish to altstore branch
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/workflows/release-ios-publish-source.sh
