
name: Release iOS (sideload)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.meta.outputs.version }}
      size: ${{ steps.pack.outputs.size }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: bash .github/workflows/release-ios-version.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS deps
        working-directory: apps/mobile
        run: npm ci

      - name: Stamp version into app.json
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/release-ios-stamp.sh"

      - name: Expo prebuild (generate native iOS project)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned archive
        working-directory: apps/mobile/ios
        run: bash "$GITHUB_WORKSPACE/.github/workflows/release-ios-build.sh"

      - name: Package .ipa
        id: pack
        run: bash .github/workflows/release-ios-package.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Altune v${{ steps.meta.outputs.version }}
          body: |
            Unsigned iOS build for sideloading (AltStore / SideStore).
            Add the source once, then install/update from there:
            `https://raw.githubusercontent.com/${{ github.repository }}/altstore/apps.json`
          files: ${{ runner.temp }}/Altune.ipa
          fail_on_unmatched_files: true

  update-source:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Seed working copy with the currently published manifest
        run: |
          git fetch origin altstore
          git show origin/altstore:apps.json > apps.json

      - name: Update AltStore manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIZE: ${{ needs.build.outputs.size }}
          REPO: ${{ github.repository }}
        run: node scripts/update-altstore-source.mjs

      - name: Publish to altstore branch
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/workflows/release-ios-publish-source.sh
