# Mobile test gate. Reachable only as a reusable workflow: called by the PR gate
# (pr-gate.yml) on PRs/merge-queue that touch the Expo app, by deploy-web.yml on
# pushes to main, and by release-ios.yml on tags. A `push` trigger of its own ran
# the suite a second time on every mobile merge, so it has none. It deliberately
# has NO `pull_request` trigger of its own either — that ran
# a second, unprefixed copy on every PR that shared this workflow's concurrency
# group with the gate-called copy and cancelled it, stalling the required check.
#
# The checks are independent, so they run as PARALLEL jobs (typecheck, lint,
# architecture, test, react-quality) rather than one serial chain. Wall time is
# the slowest lane, not the sum. Shared node+deps setup lives in the local
# .github/actions/mobile-setup composite action.
#
# Until 2026-07-30 the only workflow watching apps/mobile/** was react-doctor,
# which is advisory. The coverage ratchet in jest.config.js, the feature-
# isolation zones in eslint.config.js, and `tsc --noEmit` all existed and none
# gated a commit. This workflow is what makes them real.
name: Test mobile

on:
  # Callable, so the PR gate, deploy-web.yml and release-ios.yml can gate on it.
  workflow_call:

concurrency:
  group: test-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
        with:
          typed-routes: "true"
      - name: typecheck
        run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff-scoped step below can find the merge base and
          # enforce the mechanical style rules only on the lines this PR changed.
          fetch-depth: 0
      - uses: ./.github/actions/mobile-setup
      # Persist eslint's result cache across runs so unchanged files are skipped.
      - uses: actions/cache@v6
        with:
          path: apps/mobile/.eslintcache
          key: eslint-${{ hashFiles('apps/mobile/eslint.config.js', 'apps/mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('apps/mobile/eslint.config.js', 'apps/mobile/package-lock.json') }}-
      # Feature isolation (never import across features; shared never imports a
      # feature) enforced by import/no-restricted-paths, the mobile counterpart
      # to the backend's depguard rules.
      - name: lint
        run: npx eslint . --cache --cache-location .eslintcache
      # Mechanical TS/React style (10-line functions, complexity cap, no
      # else-after-return, banned vague names).
      # A 10-line cap across the whole app fails hundreds of existing files, so
      # eslint.config.js gates these behind ESLINT_DIFF_SCOPED and this step runs
      # them scoped to ONLY the lines this change ADDED (merge-base delta, like
      # react-doctor) — a new violation blocks, a pre-existing long function or
      # vague name in a file the change merely touches never regresses. The diff
      # base is the PR base on a PR and the previous commit on a push; with no
      # usable base (merge queue) the step is a no-op, the pre-merge PR run having
      # already enforced it.
      - name: mechanical style on changed code (diff-scoped)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT" = "merge_group" ] && [ -n "$MERGE_BASE" ]; then
            BASE="$MERGE_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            echo "::error::no usable diff base ($EVENT)"
            exit 1
          fi
          echo "Diff base: $BASE"
          node scripts/lint-changed-lines.mjs "$BASE"
      - name: script and rule tests
        run: |
          files=$(git ls-files 'scripts/__tests__/*.test.mjs' 'eslint-rules/__tests__/*.test.js' 'eslint.config.test.js')
          [ -z "$files" ] || node --test $files

  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: fallow's health scoring weights git CHURN. Under a
          # depth-1 clone it has none and the numbers drift from a local run.
          fetch-depth: 0
      - uses: ./.github/actions/mobile-setup
      # Architecture, dead code and duplication (fallow). Zero tolerance:
      # circular-dependencies and boundary-violation are `error` in .fallowrc.json.
      # fallow's own exit code ignores rule severity; --fail-on-issues (in the
      # `fallow` script) is what actually gates.
      - name: architecture, dead code and duplication (fallow)
        run: npm run fallow
      # Complexity health is a RATCHET, not a floor. ADVISORY until the ceiling is
      # re-measured FROM CI (the first run scored 145 vs a locally-derived 137, see
      # fetch-depth above). Read the number a green main prints, set MAX to it, and
      # delete continue-on-error. If the summary can't be parsed the step FAILS —
      # a gate that silently measures nothing is worse than no gate.
      - name: complexity ratchet (fallow)
        continue-on-error: true
        env:
          MAX: 137
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-mobile-complexity.sh"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      # Persist jest's transform cache across runs.
      - uses: actions/cache@v6
        with:
          path: apps/mobile/.jestcache
          key: jest-${{ hashFiles('apps/mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ hashFiles('apps/mobile/package-lock.json') }}-
      # Per-glob coverage floors live in jest.config.js as RATCHET_RAISE_ONLY.
      # Per-directory on purpose: a single global average lets an uncovered
      # reducer hide behind well-covered UI. Never lower a floor to go green.
      - name: test with coverage ratchet
        run: npx jest --coverage --ci --cacheDirectory .jestcache

  web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      - name: expo web export
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.test
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npx expo export -p web

  react-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      # React-specific quality (react-doctor): security, bugs, performance,
      # maintainability. Errors are zero-tolerance; warnings are a ratchet at the
      # measured 106. Uses the pinned devDependency, NOT react-doctor@latest: a
      # gate must not change behaviour because upstream shipped a new rule.
      - name: react quality gate (react-doctor)
        env:
          MAX_WARNINGS: 106
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-mobile-react-doctor.sh"
      - name: upload react-doctor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-doctor-report
          path: apps/mobile/doctor-report.json
          if-no-files-found: ignore
          retention-days: 14
