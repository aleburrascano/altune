# Mobile test gate. Runs on PRs and pushes that touch the Expo app.
#
# The checks are independent, so they run as PARALLEL jobs (typecheck, lint,
# architecture, test, react-quality) rather than one serial chain. Wall time is
# the slowest lane, not the sum. Shared node+deps setup lives in the local
# .github/actions/mobile-setup composite action.
#
# Until 2026-07-30 the only workflow watching apps/mobile/** was react-doctor,
# which is advisory. The coverage ratchet in jest.config.js, the feature-
# isolation zones in eslint.config.js, and `tsc --noEmit` all existed and none
# gated a commit. This workflow is what makes them real.
name: Test mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/test-mobile.yml'
      - '.github/actions/mobile-setup/**'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/test-mobile.yml'
      - '.github/actions/mobile-setup/**'
  # Callable, so release-ios.yml can gate a tagged build on it. Tag pushes match
  # neither trigger above, so without this a release ships unverified.
  workflow_call:

concurrency:
  group: test-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
        with:
          typed-routes: "true"
      - name: typecheck
        run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      # Persist eslint's result cache across runs so unchanged files are skipped.
      - uses: actions/cache@v4
        with:
          path: apps/mobile/.eslintcache
          key: eslint-${{ hashFiles('apps/mobile/eslint.config.js', 'apps/mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('apps/mobile/eslint.config.js', 'apps/mobile/package-lock.json') }}-
      # Feature isolation (never import across features; shared never imports a
      # feature) enforced by import/no-restricted-paths, the mobile counterpart
      # to the backend's depguard rules.
      - name: lint
        run: npx eslint "src/**/*.{ts,tsx}" --cache --cache-location .eslintcache

  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: fallow's health scoring weights git CHURN. Under a
          # depth-1 clone it has none and the numbers drift from a local run.
          fetch-depth: 0
      - uses: ./.github/actions/mobile-setup
      # Architecture, dead code and duplication (fallow). Zero tolerance:
      # circular-dependencies and boundary-violation are `error` in .fallowrc.json.
      # fallow's own exit code ignores rule severity; --fail-on-issues (in the
      # `fallow` script) is what actually gates.
      - name: architecture, dead code and duplication (fallow)
        run: npm run fallow
      # Complexity health is a RATCHET, not a floor. ADVISORY until the ceiling is
      # re-measured FROM CI (the first run scored 145 vs a locally-derived 137, see
      # fetch-depth above). Read the number a green main prints, set MAX to it, and
      # delete continue-on-error. If the summary can't be parsed the step FAILS —
      # a gate that silently measures nothing is worse than no gate.
      - name: complexity ratchet (fallow)
        continue-on-error: true
        run: |
          MAX=137
          OUT=$(npm run --silent fallow:health 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true)
          echo "$OUT" | tail -3
          SUMMARY=$(echo "$OUT" | grep -E 'above threshold|No issues found' | tail -1 || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::could not parse fallow health output; the complexity ratchet verified nothing"
            exit 1
          fi
          N=$(echo "$SUMMARY" | grep -oE '[0-9]+ above threshold' | grep -oE '[0-9]+' || echo 0)
          echo "complexity findings: ${N} (ceiling ${MAX})"
          [ "$N" -le "$MAX" ] || { echo "::error::complexity findings rose to ${N}, above the ${MAX} ceiling"; exit 1; }

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      # Persist jest's transform cache across runs.
      - uses: actions/cache@v4
        with:
          path: apps/mobile/.jestcache
          key: jest-${{ hashFiles('apps/mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ hashFiles('apps/mobile/package-lock.json') }}-
      # Per-glob coverage floors live in jest.config.js as RATCHET_RAISE_ONLY.
      # Per-directory on purpose: a single global average lets an uncovered
      # reducer hide behind well-covered UI. Never lower a floor to go green.
      - name: test with coverage ratchet
        run: npx jest --coverage --ci --cacheDirectory .jestcache

  react-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      # React-specific quality (react-doctor): security, bugs, performance,
      # maintainability. Errors are zero-tolerance; warnings are a ratchet at the
      # measured 106. Uses the pinned devDependency, NOT react-doctor@latest: a
      # gate must not change behaviour because upstream shipped a new rule.
      - name: react quality gate (react-doctor)
        run: |
          MAX_WARNINGS=106
          npm run --silent doctor:ci > doctor-report.json || true
          node -e "
            const s = require('./doctor-report.json').summary;
            console.log('errors:', s.errorCount, '| warnings:', s.warningCount, '(ceiling', $MAX_WARNINGS + ')');
            if (s.errorCount > 0) { console.log('::error::react-doctor reported ' + s.errorCount + ' error(s)'); process.exit(1); }
            if (s.warningCount > $MAX_WARNINGS) { console.log('::error::react-doctor warnings rose to ' + s.warningCount + ', above the $MAX_WARNINGS ceiling'); process.exit(1); }
          "
      - name: upload react-doctor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-doctor-report
          path: apps/mobile/doctor-report.json
          if-no-files-found: ignore
          retention-days: 14
