name: Test mobile

on:
  workflow_call:

concurrency:
  group: test-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
        with:
          typed-routes: "true"
      - name: typecheck
        run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mobile-setup
      - uses: actions/cache@v6
        with:
          path: apps/mobile/.eslintcache
          key: eslint-${{ hashFiles('apps/mobile/eslint.config.js', 'apps/mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('apps/mobile/eslint.config.js', 'apps/mobile/package-lock.json') }}-
      - name: lint
        run: npx eslint . --cache --cache-location .eslintcache
      - name: mechanical style on changed code (diff-scoped)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT" = "merge_group" ] && [ -n "$MERGE_BASE" ]; then
            BASE="$MERGE_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            echo "::error::no usable diff base ($EVENT)"
            exit 1
          fi
          echo "Diff base: $BASE"
          node scripts/lint-changed-lines.mjs "$BASE"
      - name: script and rule tests
        run: |
          files=$(git ls-files 'scripts/__tests__/*.test.mjs' 'eslint-rules/__tests__/*.test.js' 'eslint.config.test.js')
          [ -z "$files" ] || node --test $files

  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mobile-setup
      - name: architecture, dead code and duplication (fallow)
        run: npm run fallow
      - name: complexity ratchet (fallow)
        continue-on-error: true
        env:
          MAX: 137
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-mobile-complexity.sh"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      - uses: actions/cache@v6
        with:
          path: apps/mobile/.jestcache
          key: jest-${{ hashFiles('apps/mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ hashFiles('apps/mobile/package-lock.json') }}-
      - name: test with coverage ratchet
        run: npx jest --coverage --ci --cacheDirectory .jestcache

  web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      - name: expo web export
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.test
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npx expo export -p web

  react-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-setup
      - name: react quality gate (react-doctor)
        env:
          MAX_WARNINGS: 106
        run: bash "$GITHUB_WORKSPACE/.github/workflows/test-mobile-react-doctor.sh"
      - name: upload react-doctor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-doctor-report
          path: apps/mobile/doctor-report.json
          if-no-files-found: ignore
          retention-days: 14
