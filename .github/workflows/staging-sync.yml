name: staging-sync

on:
  schedule:
    # 08:00 UTC (~04:00 Eastern), outside the usual merge window.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: staging-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Verify deploy secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/workflows/require-secrets.sh DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY

      - name: Sync staging from prod over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: flock -w 600 ~/.altune-staging.lock bash ~/altune/services/go-api/deploy/staging-sync.sh
