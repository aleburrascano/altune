# Refresh the staging DB with prod's data (deploy/staging-sync.sh), nightly and on
# demand, so staging is exercised against the real library rather than an empty one.
# One-way prod -> staging; prod is only read. The script replaces each matched
# account's staging data in one transaction, so a failed run leaves staging as it was.
#
# It runs the script from the VM's current checkout and never moves it: the checkout
# belongs to deploy-backend.yml. This job and both backend deploys hold the VM lock
# /home/ubuntu/.altune-staging.lock for their whole run, so a deploy can
# never reset the checkout or migrate the staging DB under a running sync (and a
# sync waits out a deploy in progress). GitHub concurrency groups cannot do this:
# deploy-staging's group cancels in progress, which would kill a sync mid-run.
# Run it by hand after a deploy (Actions -> staging-sync -> Run workflow) to pull
# fresh prod data right away.
name: staging-sync

on:
  schedule:
    # 08:00 UTC (~04:00 Eastern), outside the usual merge window.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: staging-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Verify deploy secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/workflows/require-secrets.sh DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY

      - name: Sync staging from prod over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: flock -w 600 /home/ubuntu/.altune-staging.lock bash /home/ubuntu/altune/services/go-api/deploy/staging-sync.sh
