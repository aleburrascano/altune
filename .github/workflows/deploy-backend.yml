
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'services/go-api/**'
      - 'services/overseer/**'
  workflow_dispatch:


jobs:
  changes:
    concurrency:
      group: deploy-cheap-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/workflows/deploy-backend-changes.sh

  test:
    uses: ./.github/workflows/test-backend.yml

  test-overseer:
    uses: ./.github/workflows/test-overseer.yml

  deploy-staging:
    needs: [changes, test, test-overseer]
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    concurrency:
      group: deploy-cheap-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Verify deploy secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/workflows/require-secrets.sh DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY

      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            git -C ~/altune fetch --prune origin
            git -C ~/altune show ${{ github.sha }}:services/go-api/deploy/release.sh >~/.altune-release-staging
            bash ~/.altune-release-staging staging ${{ github.sha }}

  smoke-staging:
    needs: [deploy-staging]
    concurrency:
      group: deploy-cheap-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Verify deploy secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/workflows/require-secrets.sh DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY

      - name: Smoke-test staging over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            cd ~/altune/services/go-api
            bash deploy/smoke.sh ${{ vars.STAGING_API_URL }} altune-staging-overseer ${{ github.sha }}

  approve-prod:
    needs: [smoke-staging]
    concurrency:
      group: deploy-prod-approval
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record the approved commit
        env:
          SHA: ${{ github.sha }}
        run: echo "Prod promotion approved for $SHA."

  deploy-prod:
    needs: [approve-prod]
    concurrency:
      group: deploy-prod-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Verify deploy secrets are present
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/workflows/require-secrets.sh DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY

      - name: Deploy prod over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            git -C ~/altune fetch --prune origin
            git -C ~/altune show ${{ github.sha }}:services/go-api/deploy/release.sh >~/.altune-release-prod
            bash ~/.altune-release-prod prod ${{ github.sha }} ${{ vars.PROD_API_URL }}

      - name: Report rollback command on failure
        if: failure()
        run: |
          echo "::error title=Deploy failed::The previous version is still serving."
          echo "To force a manual rollback, SSH to the VM and run:"
          echo "  cd ~/altune/services/go-api && bash deploy/rollback.sh"
