# Altune label taxonomy — source of truth.
# Sync to GitHub with a label-sync tool or the gh loop in the repo docs.
# Tag a ticket with one label from each dimension it needs.

# --- area: which module (platform-agnostic; platform:* says which side) ---
- name: "area:acquisition"
  color: "1d76db"
  description: "Download pipeline, retry, provider fan-out"
- name: "area:catalog"
  color: "1d76db"
  description: "Tracks, playlists, featured artists, audio storage"
- name: "area:discovery"
  color: "1d76db"
  description: "Search, ranking, enrichment, identity"
- name: "area:playback"
  color: "1d76db"
  description: "Queue state and playback"
- name: "area:auth"
  color: "1d76db"
  description: "Authentication and sessions"
- name: "area:feedback"
  color: "1d76db"
  description: "User feedback surfaces"
- name: "area:admin"
  color: "1d76db"
  description: "Console, alerting, request tracing"
- name: "area:infra"
  color: "1d76db"
  description: "App wiring, shared infra, observability, config"
- name: "area:providers"
  color: "1d76db"
  description: "External music providers (deezer, soundcloud, musicbrainz, ...)"
- name: "area:data"
  color: "1d76db"
  description: "DB schema, migrations, tables"
- name: "area:app-shell"
  color: "1d76db"
  description: "Mobile navigation, components, theming"
- name: "area:offline"
  color: "1d76db"
  description: "Mobile outbox, sync, persisted state"
- name: "area:settings"
  color: "1d76db"
  description: "Settings screen and preferences"

# --- platform: which side ---
- name: "platform:mobile"
  color: "006b75"
  description: "Expo/RN app in apps/mobile/"
- name: "platform:backend"
  color: "006b75"
  description: "Go API in services/go-api/"

# --- type: nature of the work (bug + enhancement kept as GitHub defaults) ---
- name: "type:refactor"
  color: "d4c5f9"
  description: "Restructure code; behavior unchanged"
- name: "type:hygiene"
  color: "d4c5f9"
  description: "Tidying without moving structure: rename, dedupe, glossary, lint"
- name: "type:test"
  color: "d4c5f9"
  description: "Test coverage or QA work"
- name: "type:security"
  color: "d4c5f9"
  description: "Security hardening, redaction, config validation"
- name: "type:perf"
  color: "d4c5f9"
  description: "Performance work"
- name: "type:docs"
  color: "d4c5f9"
  description: "Documentation"
- name: "type:tooling"
  color: "d4c5f9"
  description: "CI, linters, build, depguard"
- name: "type:spike"
  color: "d4c5f9"
  description: "Research or ADR-first decision work; no shippable code"

# --- source: where it came from ---
- name: "source:audit"
  color: "ededed"
  description: "Raised by a global-workflow audit"

# --- flow: ticket state ---
- name: "needs-triage"
  color: "fbca04"
  description: "Seen, not yet groomed or sliced"

# --- kept existing labels ---
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "epic"
  color: "5319e7"
  description: "A parent feature, split into sub-issues"
- name: "ready"
  color: "0e8a16"
  description: "Self-contained, safe to start now"
- name: "blocked"
  color: "b60205"
  description: "Waiting on another issue"
- name: "from-app"
  color: "ededed"
  description: "Reported from the app"
- name: "ux"
  color: "ededed"
  description: "User-experience concern"
