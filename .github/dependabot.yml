version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/services/go-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type:tooling"
      - "platform:backend"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type:tooling"
      - "platform:mobile"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type:tooling"
