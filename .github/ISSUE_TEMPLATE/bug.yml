name: Bug
description: Something is broken. Report what happened so it can be reproduced.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The broken behaviour, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - mobile app
        - backend / API
        - not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Track, screen, logs, screenshots, how often it happens.
