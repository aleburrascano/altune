<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altune — Screen Atlas</title>
<style>
:root{
  --canvas:#121214; --s1:#1C1C20; --s2:#232328; --border:#2A2A30;
  --scrim:rgba(0,0,0,.6);
  --tp:#F4F4F6; --ts:#A6A6AE; --tt:#8C8C96; --t6:#74747E;
  --accent:#2D5BFF; --accentPressed:#244BD6; --accentText:#6B8FFF; --accentTint:rgba(45,91,255,.25);
  --onAccent:#fff; --green:#3DD68C; --amber:#F5B544; --red:#FF5A5F;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0c;color:var(--tp);font-family:var(--font);-webkit-font-smoothing:antialiased}

/* ---------- page chrome ---------- */
.top{position:sticky;top:0;z-index:100;background:rgba(10,10,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-inner{max-width:1600px;margin:0 auto;padding:14px 24px 0}
.brand{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.brand h1{font-size:19px;letter-spacing:-.4px;font-weight:700}
.brand span{font-size:12px;color:var(--tt)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--ts);font:500 13px/1 var(--font);padding:11px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--tp);background:rgba(255,255,255,.04)}
.tabs button.on{color:var(--tp);border-bottom-color:var(--accent);background:rgba(45,91,255,.10)}
.tabs button i{font-style:normal;color:var(--t6);margin-left:6px;font-size:11px}

main{max-width:1600px;margin:0 auto;padding:28px 24px 80px}
.panel{display:none}
.panel.on{display:block}
.panel-head{margin-bottom:22px;max-width:760px}
.panel-head h2{font-size:24px;letter-spacing:-.5px;margin-bottom:6px}
.panel-head p{font-size:14px;line-height:1.6;color:var(--ts)}
.grid{display:flex;flex-wrap:wrap;gap:34px 28px;align-items:flex-start}

.item{width:360px}
.cap{margin-bottom:10px}
.cap b{display:block;font-size:13px;font-weight:600;letter-spacing:-.1px}
.cap code{display:block;font-size:11px;color:var(--t6);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px}
.cap em{display:block;font-size:11.5px;color:var(--amber);font-style:normal;margin-top:4px;line-height:1.45}

/* ---------- phone ---------- */
.phone{width:360px;height:740px;background:var(--canvas);border:1px solid var(--border);border-radius:26px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 18px 48px rgba(0,0,0,.5)}
.status{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-weight:600;color:var(--tp);opacity:.85}
.status .dots{display:flex;gap:4px;align-items:center}
.status .dots span{display:block;width:14px;height:9px;border:1px solid currentColor;border-radius:2px;opacity:.7}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
.screen::-webkit-scrollbar{width:4px}
.screen::-webkit-scrollbar-thumb{background:#2f2f36;border-radius:2px}
.pad{padding-left:16px;padding-right:16px}

/* ---------- type ---------- */
.dxl{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.5px}
.dl{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.5px}
.tt{font-size:20px;line-height:26px;font-weight:600}
.bd{font-size:16px;line-height:22px}
.bs{font-size:16px;line-height:22px;font-weight:600}
.lb{font-size:14px;line-height:18px;font-weight:500}
.cp{font-size:12px;line-height:16px;font-weight:500}
.sec{color:var(--ts)} .ter{color:var(--tt)} .acc{color:var(--accentText)} .grn{color:var(--green)} .red{color:var(--red)} .amb{color:var(--amber)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upp{text-transform:uppercase;letter-spacing:1px}
.ctr{text-align:center}

/* ---------- atoms ---------- */
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:4px}

.art{border-radius:6px;flex:none;background:var(--s2);overflow:hidden;position:relative}
.rnd{border-radius:999px}
.a1{background:linear-gradient(140deg,#3a2d6d,#8f4fd6)}
.a2{background:linear-gradient(140deg,#0f3b52,#2f9ec4)}
.a3{background:linear-gradient(140deg,#5c1f2b,#d1554e)}
.a4{background:linear-gradient(140deg,#1e4034,#4fbf8b)}
.a5{background:linear-gradient(140deg,#4a3a12,#d6a13c)}
.a6{background:linear-gradient(140deg,#2a2350,#5f6bd6)}
.a7{background:linear-gradient(140deg,#3d1f3f,#a44fa0)}
.a8{background:linear-gradient(140deg,#123043,#3f7fb0)}
.a9{background:linear-gradient(140deg,#432a1a,#b57346)}
.a0{background:linear-gradient(140deg,#242428,#3a3a42)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font:600 15px/1 var(--font);border:0;cursor:default}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--s1);color:var(--tp)}
.btn-g{background:none;color:var(--accentText);padding:0;min-height:44px}
.btn-dis{background:var(--s2);color:var(--t6)}
.full{width:100%}

.chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--s2);color:var(--ts);font:500 14px/1 var(--font)}
.chip.on{background:var(--accent);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.field{height:48px;border-radius:12px;background:var(--s1);border:1px solid transparent;display:flex;align-items:center;padding:0 16px;color:var(--tt);font-size:16px}
.field.on{border-color:var(--accent);color:var(--tp)}
.field.err{border-color:var(--red)}
.search{height:48px;border-radius:12px;background:var(--s1);border:1px solid transparent;display:flex;align-items:center;gap:12px;padding:0 14px;color:var(--tt);font-size:16px}
.search.on{border-color:var(--accent)}
.search.open{border-bottom-left-radius:0;border-bottom-right-radius:0}

.banner{border-radius:12px;padding:12px 14px;font-size:14px;line-height:19px}
.b-info{background:rgba(45,91,255,.12);color:var(--accentText);border:1px solid rgba(45,91,255,.28)}
.b-danger{background:rgba(255,90,95,.12);color:#ff8a8e;border:1px solid rgba(255,90,95,.3)}

.skel{background:linear-gradient(90deg,#1e1e23,#2a2a31,#1e1e23);border-radius:8px}
.hair{height:1px;background:var(--border)}
.divider{height:1px;background:var(--border);margin:16px 0}

/* rows */
.lrow{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.drow{padding:12px 4px;display:flex;align-items:center;gap:12px;border-radius:12px}
.trow{display:flex;align-items:center;gap:12px;min-height:52px}

/* tabbar */
.tabbar{flex:none;display:flex;border-top:1px solid var(--border);background:var(--canvas);padding-top:8px;padding-bottom:14px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--ts)}
.tab .ind{width:28px;height:2px;border-radius:2px;background:transparent;margin-bottom:8px}
.tab.on{color:var(--accent)} .tab.on .ind{background:var(--accent)}
.tab .lbl{font-size:12px;font-weight:500;margin-top:4px}

/* mini player */
.mini{flex:none;background:var(--s1);border-top:1px solid var(--border)}
.mini .prog{height:2px;background:var(--border)}
.mini .prog i{display:block;height:2px;background:var(--accent)}
.mini .body{display:flex;align-items:center;gap:12px;padding:8px 16px}

/* downloads bar */
.dlbar{flex:none;background:var(--s1);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 16px}
.segs{display:flex;gap:4px;margin-top:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--border);display:block}
.segs i.f{background:var(--accent)}

/* overlays */
.ovl{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--s1);border-top-left-radius:20px;border-top-right-radius:20px;padding:12px 20px 32px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
.dialog{margin:auto;width:calc(100% - 48px);background:var(--s1);border-radius:16px;padding:20px}
.menu{position:absolute;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 14px 34px rgba(0,0,0,.6)}
.menu div{padding:11px 12px;font-size:15px;border-radius:8px}

/* shipped detail scaffold */
.statusov{position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-weight:600;z-index:7;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.fbar{position:absolute;top:6px;left:12px;right:12px;height:44px;display:flex;align-items:center;gap:8px;z-index:6}
.fbar .g{width:40px;height:40px;border-radius:20px;background:rgba(10,10,12,.42);display:flex;align-items:center;justify-content:center;flex:none}
.barsolid{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--canvas);border-bottom:1px solid var(--border)}
.bleed{position:relative;width:100%;height:318px;flex:none}
.bleed .bg{position:absolute;inset:0}
.bleed .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,20,.55) 0%,rgba(18,18,20,.10) 24%,rgba(18,18,20,.34) 54%,rgba(18,18,20,.90) 86%,var(--canvas) 100%)}
.bleed .btxt{position:absolute;left:16px;right:16px;bottom:16px}
.edit{font-size:34px;line-height:38px;font-weight:700;letter-spacing:-1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ppill{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
.ppill.dis{background:var(--s2);color:var(--t6)}
.spill{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--s1);flex:none}
.facts{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:12px;margin-top:20px}
.fk{font-size:10px;line-height:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t6)}
.fv{font-size:16px;line-height:22px;font-weight:600;margin-top:1px}
.fv.amb{color:var(--amber)}.fv.grn{color:var(--green)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.navrow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--border)}
.sdot{width:36px;height:36px;border-radius:999px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none}
.sdot.on{background:rgba(61,214,140,.16);border-color:transparent}
.trow2{display:flex;align-items:center;gap:12px;min-height:52px}
.dchip{min-height:36px;display:flex;align-items:center;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--border);color:var(--ts);font-size:14px;font-weight:500}
.dchip.on{background:var(--accent);border-color:transparent;color:#fff}
.simrow2{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border)}

/* misc */
.gridcov{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.railh{display:flex;gap:16px;overflow:hidden}
.hero-glow{position:absolute;top:0;left:0;right:0;height:340px;background:linear-gradient(180deg,rgba(45,91,255,.19),rgba(45,91,255,.03) 55%,transparent);pointer-events:none}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px}
.eq i{width:4px;border-radius:2px;background:var(--accent);display:block}
svg{flex:none}
</style>
</head>
<body>

<div class="top"><div class="top-inner">
  <div class="brand"><h1>Altune — Screen Atlas</h1><span>every screen &amp; state, as built today · dark theme · 360×740</span></div>
  <div class="tabs" id="tabs"></div>
</div></div>

<main id="main"></main>

<script>
/* ------------------------------------------------------------------ icons */
const P = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  cleft:'<path d="m15 18-6-6 6-6"/>',
  cright:'<path d="m9 18 6-6-6-6"/>',
  cdown:'<path d="m6 9 6 6 6-6"/>',
  cup:'<path d="m18 15-6-6-6 6"/>',
  play:'<path d="M6 3.5v17l14-8.5z" fill="currentColor" stroke="none"/>',
  pause:'<rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/>',
  sback:'<path d="M19 20 9 12l10-8z" fill="currentColor" stroke="none"/><rect x="4" y="4" width="2.5" height="16" fill="currentColor" stroke="none"/>',
  sfwd:'<path d="M5 4l10 8-10 8z" fill="currentColor" stroke="none"/><rect x="17.5" y="4" width="2.5" height="16" fill="currentColor" stroke="none"/>',
  shuffle:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  repeat:'<path d="m17 2 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>',
  more:'<circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/>',
  moreh:'<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
  list:'<path d="M3 6h11M3 12h11M3 18h7M18 5v11"/><circle cx="16" cy="17" r="2.4"/>',
  mic:'<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM5 10v1a7 7 0 0 0 14 0v-1M12 19v3"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z" fill="currentColor" stroke="none"/>',
  lib:'<path d="M16 6 22 18M4 4v16M9 4v16"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.9 3H10a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  check2:'<path d="m4 12.5 5 5L20 6.5"/>',
  down:'<circle cx="12" cy="12" r="9"/><path d="M12 8v7m0 0-3-3m3 3 3-3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  rotate:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  google:'<path d="M21 12.2c0-.7-.06-1.2-.2-1.8H12v3.4h5.1c-.1.9-.66 2.2-1.9 3.1l3 2.3c1.8-1.6 2.8-4.1 2.8-7z" fill="#4285F4" stroke="none"/><path d="M12 21c2.4 0 4.5-.8 6-2.2l-3-2.3c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.5-5-3.6l-3 2.3A9 9 0 0 0 12 21z" fill="#34A853" stroke="none"/><path d="M7 13.8a5.4 5.4 0 0 1 0-3.5L4 8a9 9 0 0 0 0 8z" fill="#FBBC05" stroke="none"/><path d="M12 6.6c1.6 0 2.7.7 3.4 1.3l2.5-2.5A9 9 0 0 0 4 8l3 2.3c.7-2.1 2.7-3.7 5-3.7z" fill="#EA4335" stroke="none"/>',
};
function ic(n,s=20,c='currentColor'){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`}

/* ------------------------------------------------------------ shared bits */
const bar = (t='9:41')=>`<div class="status"><span>${t}</span><div class="dots"><span></span></div></div>`;
const art = (cls,size,r='6px')=>`<div class="art ${cls}" style="width:${size}px;height:${size}px;border-radius:${r}"></div>`;
const tabbar = (on)=>`<div class="tabbar">
  ${['discover','library','settings'].map(k=>{
    const I={discover:'compass',library:'lib',settings:'cog'}[k];
    const L={discover:'Discover',library:'Library',settings:'Settings'}[k];
    return `<div class="tab ${on===k?'on':''}"><div class="ind"></div>${ic(I,22)}<span class="lbl">${L}</span></div>`;
  }).join('')}
</div>`;
const mini = (o={})=>`<div class="mini">
  <div class="prog"><i style="width:${o.pct??38}%"></i></div>
  <div class="body">${art('a1',44,'8px')}
    <div class="grow"><div class="lb ell">${o.title??'Midnight City'}</div>
      <div class="cp sec ell">${o.sub??'M83'}</div></div>
    ${ic(o.icon??'pause',22)}${o.next?ic('sfwd',18):''}</div></div>`;

/* --- shipped detail scaffold (1ad8377) --- */
const bleedTop = ()=>`
 <div class="statusov"><span>9:41</span><span>▯</span></div>
 <div class="fbar"><div class="g">${ic('cleft',22)}</div><div class="grow"></div><div class="g">${ic('moreh',20)}</div></div>`;
const bleedBanner = (a,title,secondary)=>`
 <div class="bleed"><div class="bg ${a}"></div><div class="scr"></div>
   <div class="btxt"><div class="edit">${title}</div><div class="mt4">${secondary}</div></div></div>`;
const playPill = (label,disabled=0)=>`<div class="ppill grow${disabled?' dis':''}">${ic('play',18,disabled?'var(--t6)':'#fff')}<span>${label}</span></div>`;
const savePill = (label,done=0)=>`<div class="spill">${done?ic('check2',18,'var(--green)'):ic('plus',18,'var(--accentText)')}<span class="lb ${done?'grn':''}">${label}</span></div>`;
const factRow = (cells)=>`<div class="pad"><div class="facts">${cells.map(c=>
  `<div><div class="fk">${c[0].toUpperCase()}</div><div class="fv ${c[2]}">${c[1]}</div></div>`).join('')}</div></div>`;
const sec = (label,action)=>`<div class="sechead"><span class="fk">${label.toUpperCase()}</span>${action?`<span class="cp acc">${action}</span>`:''}</div>`;
const navRow = (a,kicker,value,r)=>`<div class="navrow">${art(a,36,r)}
  <div class="grow"><div class="fk">${kicker.toUpperCase()}</div><div class="bd ell">${value}</div></div>
  ${ic('cright',16,'var(--tt)')}</div>`;
const saveDot = (on)=>on
  ? `<div class="sdot on">${ic('check2',17,'var(--green)')}</div>`
  : `<div class="sdot">${ic('plus',17,'var(--accentText)')}</div>`;

const heroAuth = (tagline)=>`<div style="padding:40px 20px 0">
  <div class="eq mb12"><i style="height:8px"></i><i style="height:18px"></i><i style="height:12px"></i><i style="height:22px"></i></div>
  <div class="dxl" style="letter-spacing:-1px">altune</div>
  ${tagline?`<div class="lb sec mt8">${tagline}</div>`:''}</div>`;

/* ---------------------------------------------------------------- screens */
const TABS = [];
function tab(id,title,blurb,items){TABS.push({id,title,blurb,items})}
function screen(name,route,note,inner,cls=''){return {name,route,note,inner,cls}}

/* =================================================================== AUTH */
tab('auth','Auth',

/* ------------------------------------------------------------------ render */
const tabsEl=document.getElementById('tabs'), mainEl=document.getElementById('main');
TABS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.innerHTML = t.title + `<i>${t.items.length}</i>`;
  b.onclick=()=>select(t.id);
  b.id='tb-'+t.id; tabsEl.appendChild(b);

  const p=document.createElement('section');
  p.className='panel'; p.id='pn-'+t.id;
  p.innerHTML = `<div class="panel-head"><h2>${t.title}</h2><p>${t.blurb}</p></div>
   <div class="grid">${t.items.map(s=>`
     <div class="item">
       <div class="cap"><b>${s.name}</b><code>${s.route}</code>${s.note?`<em>${s.note}</em>`:''}</div>
       <div class="phone">${s.cls==='bleed'?'':bar()}<div class="screen">${s.inner}</div></div>
     </div>`).join('')}</div>`;
  mainEl.appendChild(p);
});
function select(id){
  TABS.forEach(t=>{
    document.getElementById('tb-'+t.id).classList.toggle('on',t.id===id);
    document.getElementById('pn-'+t.id).classList.toggle('on',t.id===id);
  });
  location.hash=id; window.scrollTo(0,0);
}
select(location.hash.slice(1)||TABS[0].id);
