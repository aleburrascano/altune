provider: spotify
reference: 'none: the adapter calls the web player''s private api-partner.spotify.com pathfinder GraphQL (persisted queries, session from open.spotify.com/api/token and clienttoken.spotify.com) plus open.spotify.com/oembed; Spotify documents none of these, and its public OpenAPI file (developer.spotify.com/reference/web-api/open-api-schema.yaml) describes the separate api.spotify.com Web API, which we don''t call'
entities:
  access_token:
    fixtures:
      - id: "61"
        why: the newest TOTP secret version, the one the adapter tries first
    fields:
      - path: _notes
        type: string
        seen: [live]
        read: false
        unused: Spotify's notice that this endpoint is not covered by its developer terms; not data
      - path: accessToken
        type: string
        seen: [live]
        read: true
      - path: accessTokenExpirationTimestampMs
        type: number
        seen: [live]
        read: true
      - path: clientId
        type: string
        seen: [live]
        read: false
        unused: the web-player client id the token was issued to, the same constant the adapter sends to clienttoken
      - path: error
        type: unseen
        seen: []
        read: true
        absent: kept for the old 200 {"error":"totpVerExpired"} reply; Spotify now refuses an expired TOTP version with HTTP 400 (error is then an object), which GetJSON already turns into an error, so the loop still moves to the next version
      - path: isAnonymous
        type: boolean
        seen: [live]
        read: false
        unused: 'true: an anonymous web-player session, which is all the adapter asks for'
  album_tracks:
