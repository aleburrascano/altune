      - path: results
        type: array
        seen: [live]
        read: true
      - path: results[].country
        type: unseen
        seen: []
        read: true
        absent: 'BUG: discogsSearchResult carries country for release and master search results, but a type=artist search never sends it, so ResolveDiscogsArtist always returns an empty Country'
      - path: results[].cover_image
        type: string
        seen: [live]
        read: false
        unused: the artist's primary photo, or Discogs' spacer.gif when it has none; artwork is resolved from the artist detail images instead
      - path: results[].genre
        type: unseen
        seen: []
        read: true
        absent: 'BUG: discogsSearchResult carries genre for release and master search results, but a type=artist search never sends it, so ResolveDiscogsArtist always returns an empty Genre'
      - path: results[].genre[]
        type: unseen
        seen: []
        read: true
        absent: 'BUG: discogsSearchResult carries genre for release and master search results, but a type=artist search never sends it, so ResolveDiscogsArtist always returns an empty Genre'
      - path: results[].id
        type: number
        seen: [live]
        read: true
      - path: results[].master_id
        type: "null"
        seen: [live]
        read: false
        unused: always null for artist results; masters exist only for releases
      - path: results[].master_url
        type: "null"
        seen: [live]
        read: false
        unused: always null for artist results; masters exist only for releases
      - path: results[].resource_url
        type: string
        seen: [live]
        read: false
        unused: Discogs API URL for this record; the adapter builds URLs from the numeric id it already reads
      - path: results[].thumb
        type: string
        seen: [live]
        read: false
        unused: 150px thumbnail of the artist photo, empty when there is none; artwork is resolved from the artist detail images instead
      - path: results[].title
        type: string
        seen: [live]
        read: true
      - path: results[].type
        type: string
        seen: [live]
        read: true
      - path: results[].uri
        type: string
        seen: [live]
        read: false
        unused: Discogs web page path; altune links nothing to Discogs pages
      - path: results[].user_data
        type: object
