provider: itunes
reference: 'none: Apple''s iTunes Search API is documented only as prose web pages (the archived ''iTunes Search API'' guide), with no machine-readable schema of the search and lookup result objects'
entities:
  lookup_album:
    fixtures:
      - id: "1515978311"
        why: 'Nia Archives artist id: her artist wrapper plus her albums, singles and EPs'
      - id: "1489738823"
        why: 'Subnation artist id: a small catalogue, the artist behind Gunshot'
      - id: "1780411829"
        why: 'a DJ-mix album id (Up Ya Archives with Nia Archives, Ep. 1): the collection itself, no artist wrapper'
    fields:
      - path: resultCount
        type: number
        seen: [live]
        read: false
        unused: count of items in results; the adapter ranges over results itself and never pages, so the count adds nothing
      - path: results
        type: array
        seen: [live]
        read: true
      - path: results[].artistId
        type: number
        seen: [live]
        read: true
      - path: results[].artistLinkUrl
        type: string
        seen: [live]
        read: false
        unused: the music.apple.com page of the looked-up artist; it is only on the artist wrapper result, which the lookup drops because it keeps only track or collection results
      - path: results[].artistName
        type: string
        seen: [live]
        read: true
      - path: results[].artistType
        type: string
        seen: [live]
        read: false
        unused: Apple's artist category ('Artist'); it is only on the artist wrapper result, which the lookup drops
      - path: results[].artistViewUrl
        type: string
        seen: [live]
        read: true
      - path: results[].artworkUrl100
        type: string
        seen: [live]
        read: true
      - path: results[].artworkUrl60
        type: string
        seen: [live]
        read: false
        unused: the same cover as artworkUrl100 at 60px; the adapter upscales artworkUrl100 by rewriting its size segment
      - path: results[].collectionCensoredName
        type: string
        seen: [live]
        read: false
        unused: the album name as Apple prints it with profanity masked; the adapter shows collectionName, the real title
      - path: results[].collectionExplicitness
        type: string
        seen: [live]
        read: false
        unused: 'GAP: whether the album edition is ''explicit'', ''cleaned'' or ''notExplicit''; albums get no explicit flag, so explicit and clean editions of one album look alike'
      - path: results[].collectionId
        type: number
        seen: [live]
        read: true
      - path: results[].collectionName
        type: string
        seen: [live]
        read: true
      - path: results[].collectionPrice
        type: number
        seen: [live]
        read: false
        unused: iTunes Store purchase price of the album in currency; altune doesn't sell or price music
      - path: results[].collectionType
        type: string
        seen: [live]
        read: false
        unused: always 'Album' in every result seen, singles and EPs included, so it can't tell release types apart; the adapter derives the record type from the ' - Single' or ' - EP' name suffix
      - path: results[].collectionViewUrl
        type: string
        seen: [live]
        read: true
      - path: results[].contentAdvisoryRating
        type: string
        seen: [live]
        read: false
        unused: Apple's 'Explicit' or 'Clean' advisory, present only on some items; collectionExplicitness and trackExplicitness carry the same flag on every item
      - path: results[].copyright
        type: string
        seen: [live]
        read: true
      - path: results[].country
        type: string
        seen: [live]
        read: false
        unused: storefront of the result, always USA because the request pins country=US
      - path: results[].currency
        type: string
        seen: [live]
        read: false
        unused: currency of the store prices, always USD because the request pins country=US
      - path: results[].discNumber
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; the album and artist mappings never read a disc number
      - path: results[].previewUrl
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; only the track mapping reads a preview
      - path: results[].primaryGenreId
        type: number
        seen: [live]
        read: false
        unused: Apple's numeric genre id; the adapter reads primaryGenreName, the same genre as text
      - path: results[].primaryGenreName
        type: string
        seen: [live]
        read: true
      - path: results[].releaseDate
        type: string
        seen: [live]
        read: true
      - path: results[].trackCount
        type: number
        seen: [live]
        read: true
      - path: results[].trackExplicitness
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; collection results carry no track fields and the album mapping never reads them
      - path: results[].trackId
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; collection results carry no track fields and the album mapping never reads them
      - path: results[].trackName
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; collection results carry no track fields and the album mapping never reads them
      - path: results[].trackNumber
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; collection results carry no track fields and the album mapping never reads them
      - path: results[].trackTimeMillis
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; collection results carry no track fields and the album mapping never reads them
      - path: results[].trackViewUrl
        type: unseen
        seen: []
        read: true
        absent: itunesItem is shared with song results (search_track, lookup_song), which send it; collection results carry no track fields and the album mapping never reads them
      - path: results[].wrapperType
        type: string
        seen: [live]
        read: true
