      - id: "2265748769"
        why: Nia Archives album Emotional Junglist, 15 tracks
      - id: "2088812619"
        why: 'DJ-mix compilation FABRICLIVE 88: Flava D (DJ Mix), 30 tracks, most returned as id-only stubs'
      - id: "1615667113"
        why: 'a set typed single: Sunrise Bang Ur Head Against Tha Wall (Remixes)'
    fields:
