provider: soundcloud
reference: 'none: the adapter calls the private api-v2.soundcloud.com with a client_id scraped from soundcloud.com''s JS; SoundCloud''s public swagger (developers.soundcloud.com) describes the OAuth api.soundcloud.com, whose resources and fields differ from api-v2'
entities:
  playlist:
