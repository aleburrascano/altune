  user_toptracks:
    fixtures:
      - id: nia-archives
        why: Nia Archives' most played tracks, label releases with ISRC
      - id: prodbybullettooth
        why: a small producer's free-download bootlegs, sparse metadata
    fields:
      - path: collection
        type: array
        seen: [live]
        read: true
      - path: collection[].artwork_url
        type: string
        seen: [live]
        read: true
      - path: collection[].caption
        type: "null"
        seen: [live]
        read: false
        unused: short uploader caption shown under the player, null or an emoji in the fixtures
      - path: collection[].comment_count
        type: number
        seen: [live]
        read: false
        unused: number of timed comments; a social count altune does not rank or show
      - path: collection[].commentable
        type: boolean
        seen: [live]
        read: false
        unused: whether listeners may comment; player permission only
      - path: collection[].created_at
        type: string
        seen: [live]
        read: true
      - path: collection[].description
        type: null|string
        seen: [live]
        read: false
        unused: uploader's free-text description (hashtags, repost requests, notes)
      - path: collection[].display_date
        type: string
        seen: [live]
        read: true
      - path: collection[].download_count
        type: number
        seen: [live]
        read: false
        unused: times the original file was downloaded from SoundCloud; altune acquires audio through yt-dlp
      - path: collection[].downloadable
        type: boolean
        seen: [live]
        read: false
        unused: whether SoundCloud offers the original file for download; altune acquires audio through yt-dlp
      - path: collection[].duration
        type: number
        seen: [live]
        read: true
      - path: collection[].embeddable_by
        type: string
        seen: [live]
        read: false
        unused: who may embed the player (all, me); embed permission only
      - path: collection[].full_duration
        type: number
        seen: [live]
        read: false
        unused: 'GAP: the full length in ms; duration is only the 30000 ms preview on SNIP tracks (Waited All Night (Nia Archives Remix): duration 30000, full_duration 189283), so this is the true length the adapter should read'
      - path: collection[].genre
        type: string
        seen: [live]
        read: true
      - path: collection[].has_downloads_left
        type: boolean
        seen: [live]
        read: false
        unused: whether the uploader's download quota is left; altune acquires audio through yt-dlp
      - path: collection[].id
        type: number
        seen: [live]
        read: true
      - path: collection[].kind
        type: string
        seen: [live]
        read: true
      - path: collection[].label_name
        type: null|string
        seen: [live]
        read: false
        unused: 'GAP: the record label (Universal-Island Records Ltd., fabric Records, Rinse)'
