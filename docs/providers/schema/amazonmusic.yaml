provider: amazonmusic
reference: 'none: Amazon Music has no public catalog API; music.amazon.com/config.json and na.web.skill.music.a2z.com/api/showSearch are the web player''s private endpoints and Amazon documents neither (its Alexa skill docs cover a different API)'
entities:
  config:
    fixtures:
      - id: web
        why: config.json takes no parameters, so one fetch covers it; the id is ignored
    fields:
      - path: benefits
        type: array
        seen: [live]
        read: false
        unused: the anonymous session's subscription benefits (an empty list); search runs logged out and does not depend on them
      - path: csrf
        type: unseen
        seen: []
        read: true
        absent: 'BUG: amazonMusicSession decodes csrf.token, csrf.rnd and csrf.ts from config.json to sign every showSearch call and refuses the session when the token is empty, but config.json (fetched from this VM, 2026-11-18) no longer sends a csrf object and no response the adapter fetches does, so Amazon Music search fails before it is sent'
