name: precheck

on:
  pull_request:

defaults:
  run:
    shell: bash

concurrency:
  group: precheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  precheck:
    runs-on: precheck
    timeout-minutes: 45
    steps:
      - name: precheck
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          PR_SHAPE_TOKEN: ${{ secrets.PR_SHAPE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          repo=${ALTUNE_REPO:?the runner sets ALTUNE_REPO to its checkout}
          fetch() { git -C "$repo" fetch -q gitea "+refs/heads/$BASE:refs/remotes/gitea/$BASE" "+refs/pull/$PR/head:refs/remotes/gitea/pr/$PR"; }
          fetch || { sleep 5; fetch; } || { sleep 5; fetch; }
          setup=$(git -C "$repo" show "gitea/pr/$PR:scripts/ci/step-worktree.sh")
          . /dev/stdin "gitea/$BASE" "gitea/pr/$PR" . services/overseer/web <<<"$setup"
          GITEA_URL="$SERVER_URL" GITEA_TOKEN="$PR_SHAPE_TOKEN" bash scripts/ci/pr-shape.sh "$PR"
          bash scripts/module-spec.sh check --since "gitea/$BASE"
          bash scripts/ci/kit-self-tests.sh "gitea/$BASE"
          bash scripts/module-spec.sh mutate --since "gitea/$BASE"
