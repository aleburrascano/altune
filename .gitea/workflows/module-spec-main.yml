name: module-spec-main

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 6 * * 0"
  workflow_dispatch:
    inputs:
      open-pr:
        description: Push the compacted baseline and open a PR (false only prints what compact changed)
        default: "true"

defaults:
  run:
    shell: bash

env:
  REF: ${{ github.ref }}
  SHA: ${{ github.sha }}

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: precheck
    timeout-minutes: 20
    steps:
      - name: bash scripts/module-spec.sh check on the pushed commit, naming it when red
        run: |
          set -euo pipefail
          repo=${ALTUNE_REPO:?the runner sets ALTUNE_REPO to its checkout}
          fetch() { git -C "$repo" fetch -q gitea "+refs/heads/main:refs/remotes/gitea/main" "$REF"; }
          fetch || { sleep 5; fetch; } || { sleep 5; fetch; }
          setup=$(git -C "$repo" show "$SHA:scripts/ci/step-worktree.sh")
          . /dev/stdin gitea/main "$SHA" . services/overseer/web <<<"$setup"
          bash scripts/ci/module-spec-main.sh check

  compact:
    if: github.event_name != 'push'
    runs-on: host
    timeout-minutes: 15
    steps:
      - name: bash scripts/module-spec.sh baseline --compact, and a PR when it folded fragments
        env:
          OPEN_PR: ${{ github.event.inputs.open-pr || 'true' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          repo=${ALTUNE_REPO:?the runner sets ALTUNE_REPO to its checkout}
          fetch() { git -C "$repo" fetch -q gitea "+refs/heads/main:refs/remotes/gitea/main" "$REF"; }
          fetch || { sleep 5; fetch; } || { sleep 5; fetch; }
          setup=$(git -C "$repo" show "$SHA:scripts/ci/step-worktree.sh")
          . /dev/stdin gitea/main "$SHA" . <<<"$setup"
          bash scripts/ci/module-spec-main.sh compact
