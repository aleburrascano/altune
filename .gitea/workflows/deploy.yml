name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/go-api/**'
      - 'services/overseer/**'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  VM: ubuntu@altune.duckdns.org
  VM_KEY: /home/ubuntu/.ssh/altune-prod.key
  STAGING_URL: https://altune-staging.duckdns.org
  PROD_URL: https://altune.duckdns.org

jobs:
  deploy:
    runs-on: host
    timeout-minutes: 60
    steps:
      - name: release staging
        run: |
          ssh -i "$VM_KEY" -o BatchMode=yes -o ConnectTimeout=15 "$VM" "set -e
            git -C ~/altune fetch --prune origin
            git -C ~/altune show ${{ github.sha }}:services/go-api/deploy/release.sh >~/.altune-release-staging
            bash ~/.altune-release-staging staging ${{ github.sha }}"

      - name: smoke staging
        run: |
          ssh -i "$VM_KEY" -o BatchMode=yes -o ConnectTimeout=15 "$VM" "set -e
            cd ~/altune/services/go-api
            bash deploy/smoke.sh $STAGING_URL altune-staging-overseer ${{ github.sha }}"

      - name: release prod
        id: prod
        run: |
          ssh -i "$VM_KEY" -o BatchMode=yes -o ConnectTimeout=15 "$VM" "set -e
            git -C ~/altune fetch --prune origin
            git -C ~/altune show ${{ github.sha }}:services/go-api/deploy/release.sh >~/.altune-release-prod
            bash ~/.altune-release-prod prod ${{ github.sha }} $PROD_URL"

      - name: roll back prod
        if: failure() && steps.prod.outcome == 'failure'
        run: |
          ssh -i "$VM_KEY" -o BatchMode=yes -o ConnectTimeout=15 "$VM" "cd ~/altune/services/go-api && bash deploy/rollback.sh"

      - name: verify prod version
        run: |
          v=$(curl -fsS "$PROD_URL/health" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          echo "prod serves $v"
          [ "$v" = "${{ github.sha }}" ]
