name: e2e

on:
  pull_request:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ci
    timeout-minutes: 30
    steps:
      - name: checkout
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          fetch() { git -C "$ALTUNE_REPO" fetch -q gitea "+refs/heads/main:refs/remotes/gitea/main" ${PR:+"+refs/pull/$PR/head:refs/remotes/gitea/pr/$PR"}; }
          fetch || { sleep 5; fetch; } || { sleep 5; fetch; }
          ref=${PR:+gitea/pr/$PR}
          git -C "$ALTUNE_REPO" show "${ref:-${{ github.sha }}}:.gitea/workflows/ci-checkout.sh" | bash -s "${ref:-${{ github.sha }}}"
      - name: scope
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -n "$PR" ] || exit 0
          cd "$WT"
          if ! git diff --name-only gitea/main...HEAD | grep -qE '^(apps/mobile/|services/go-api/|scripts/e2e-stack\.sh$)'; then
            echo "E2E_SKIP=true" >>"$GITHUB_ENV"
            echo "no mobile or backend change, skipping e2e"
          fi
      - name: dependencies
        if: env.E2E_SKIP != 'true'
        run: bash "$WT/.gitea/workflows/ci-node-deps.sh" apps/mobile
      - name: browser
        if: env.E2E_SKIP != 'true'
        run: cd "$WT/apps/mobile" && npx playwright install chromium
      - name: stack up
        if: env.E2E_SKIP != 'true'
        run: cd "$WT" && bash scripts/e2e-stack.sh up
      - name: journeys
        if: env.E2E_SKIP != 'true'
        run: cd "$WT/apps/mobile" && npx playwright test -c e2e/playwright.config.ts
      - name: keep the evidence
        if: failure() && env.E2E_SKIP != 'true'
        run: |
          dir="$HOME/.cache/altune-ci/e2e/${{ github.run_id }}"
          mkdir -p "$dir"
          cp -r "$WT/apps/mobile/e2e/test-results" "$dir/" || true
          cp "${E2E_STACK_DIR:-${TMPDIR:-/tmp}/altune-e2e-stack}/api.log" "$dir/" || true
          echo "evidence: $dir"
      - name: stack down
        if: always() && env.E2E_SKIP != 'true'
        run: cd "$WT" && bash scripts/e2e-stack.sh down
      - name: clean up
        if: always()
        run: |
          [ -n "${WT:-}" ] || exit 0
          bash "$WT/.gitea/workflows/ci-cleanup.sh"
