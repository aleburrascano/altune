name: ci

on:
  push:
    branches: [main]
    paths:
      - "services/go-api/**"
      - "services/overseer/**"
      - "client/**"
      - "scripts/uptime/**"
      - "services/supabase/**"
      - ".gitea/workflows/ci.yml"
      - "scripts/ci/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  SHA: ${{ github.sha }}
  BEFORE: ${{ github.event.before }}

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  ci-changes:
    runs-on: ci
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      overseer: ${{ steps.filter.outputs.overseer }}
    steps:
      - name: checkout
        run: |
          git -C "$ALTUNE_REPO" fetch -q gitea main || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; } || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; }
          git -C "$ALTUNE_REPO" show "$SHA:scripts/ci/checkout.sh" | bash -s "$SHA"
      - name: paths
        id: filter
        run: cd "$WT" && bash scripts/ci/changes.sh "$BEFORE"
      - name: clean up
        if: always()
        run: |
          [ -n "${WT:-}" ] || exit 0
          bash "$WT/scripts/ci/cleanup.sh"


  ci-backend-static:
    needs: ci-changes
    if: needs.ci-changes.outputs.backend == 'true'
    runs-on: ci
    timeout-minutes: 40
    steps:
      - name: checkout
        run: |
          git -C "$ALTUNE_REPO" fetch -q gitea main || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; } || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; }
          git -C "$ALTUNE_REPO" show "$SHA:scripts/ci/checkout.sh" | bash -s "$SHA"
      - name: govulncheck
        run: cd "$WT/services/go-api" && govulncheck ./...
      - name: nilaway ceiling
        run: cd "$WT/services/go-api" && bash "$WT/scripts/ci/nilaway-ceiling.sh" nilaway-baseline.txt
      - name: shellcheck deploy scripts
        run: cd "$WT/services/go-api" && bash "$WT/scripts/ci/test-backend-shellcheck.sh"
      - name: deploy script self-tests
        run: |
          cd "$WT/services/go-api"
          for t in deploy/__tests__/*.test.sh; do echo "== $t"; bash "$t"; done
          bash deploy/migration-safety.sh
      - name: uptime probe self-tests
        run: |
          cd "$WT"
          bash scripts/uptime/__tests__/journey.test.sh
          bash scripts/uptime/__tests__/check.test.sh
      - name: supabase auth config self-tests
        run: cd "$WT" && bash services/supabase/__tests__/supabase-auth.test.sh
      - name: clean up
        if: always()
        run: |
          [ -n "${WT:-}" ] || exit 0
          bash "$WT/scripts/ci/cleanup.sh"

  ci-backend-tests:
    needs: ci-changes
    if: needs.ci-changes.outputs.backend == 'true'
    runs-on: ci
    timeout-minutes: 40
    steps:
      - name: checkout
        run: |
          git -C "$ALTUNE_REPO" fetch -q gitea main || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; } || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; }
          git -C "$ALTUNE_REPO" show "$SHA:scripts/ci/checkout.sh" | bash -s "$SHA"
      - name: postgres
        run: bash "$WT/scripts/ci/postgres.sh"
      - name: apply migrations
        run: cd "$WT/services/go-api" && bash "$WT/scripts/ci/test-backend-migrate.sh"
      - name: go test with integration tests
        env:
          INTEGRATION: "1"
        run: cd "$WT/services/go-api" && go test -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: coverage ratchet
        env:
          MIN: 65
        run: cd "$WT/services/go-api" && bash "$WT/scripts/ci/test-backend-coverage.sh"
      - name: acquisition selection gate
        run: cd "$WT/services/go-api" && go run ./cmd/acquisitioneval -baseline ./cmd/acquisitioneval/baselines.json
      - name: clean up
        if: always()
        run: |
          [ -n "${WT:-}" ] || exit 0
          bash "$WT/scripts/ci/cleanup.sh"

  ci-overseer:
    needs: ci-changes
    if: needs.ci-changes.outputs.overseer == 'true'
    runs-on: ci
    timeout-minutes: 30
    steps:
      - name: checkout
        run: |
          git -C "$ALTUNE_REPO" fetch -q gitea main || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; } || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; }
          git -C "$ALTUNE_REPO" show "$SHA:scripts/ci/checkout.sh" | bash -s "$SHA"
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: cd "$WT/services/overseer" && go test -race -shuffle=on -count=1 ./...
      - name: govulncheck
        run: cd "$WT/services/overseer" && govulncheck ./...
      - name: nilaway ceiling
        run: cd "$WT/services/overseer" && bash "$WT/scripts/ci/nilaway-ceiling.sh"
      - name: web dependencies
        run: bash "$WT/scripts/ci/node-deps.sh" services/overseer/web
      - name: web build and bundle budget
        run: cd "$WT/services/overseer/web" && npm run build && npm run size
      - name: clean up
        if: always()
        run: |
          [ -n "${WT:-}" ] || exit 0
          bash "$WT/scripts/ci/cleanup.sh"

  ci-mobile-tests:
    needs: ci-changes
    if: needs.ci-changes.outputs.mobile == 'true'
    runs-on: ci
    timeout-minutes: 45
    steps:
      - name: checkout
        run: |
          git -C "$ALTUNE_REPO" fetch -q gitea main || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; } || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; }
          git -C "$ALTUNE_REPO" show "$SHA:scripts/ci/checkout.sh" | bash -s "$SHA"
      - name: dependencies
        run: bash "$WT/scripts/ci/node-deps.sh" client
      - name: jest with coverage ratchet
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: cd "$WT/client" && npx jest --coverage --ci --maxWorkers=2 --workerIdleMemoryLimit=1GB --testTimeout=30000 --cacheDirectory "$HOME/.cache/altune-ci/jest"
      - name: clean up
        if: always()
        run: |
          [ -n "${WT:-}" ] || exit 0
          bash "$WT/scripts/ci/cleanup.sh"

  ci-mobile-quality:
    needs: ci-changes
    if: needs.ci-changes.outputs.mobile == 'true'
    runs-on: ci
    timeout-minutes: 30
    steps:
      - name: checkout
        run: |
          git -C "$ALTUNE_REPO" fetch -q gitea main || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; } || { sleep 5; git -C "$ALTUNE_REPO" fetch -q gitea main; }
          git -C "$ALTUNE_REPO" show "$SHA:scripts/ci/checkout.sh" | bash -s "$SHA"
      - name: dependencies
        run: bash "$WT/scripts/ci/node-deps.sh" client
      - name: react-doctor
        run: cd "$WT/client" && bash "$WT/scripts/ci/test-mobile-react-doctor.sh"
      - name: architecture, dead code and duplication (fallow)
        run: cd "$WT/client" && npm run fallow
      - name: complexity ratchet (fallow)
        run: cd "$WT/client" && bash "$WT/scripts/ci/test-mobile-complexity.sh"
      - name: clean up
        if: always()
        run: |
          [ -n "${WT:-}" ] || exit 0
          bash "$WT/scripts/ci/cleanup.sh"
