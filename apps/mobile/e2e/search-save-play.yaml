# The product spine: search → open detail → save → play.
#
# Every unit test in the repo covers one link of this chain in isolation; nothing
# covered the chain itself. This is the flow that must never break — it is the
# whole app in one pass.
#
# Two things make it inherently slower and less deterministic than the auth flow,
# and both are deliberate:
#   * Search hits live providers, so the result set for a query is not fixed. The
#     flow therefore asserts on the FIRST result row (testID `discover-row-*-0`),
#     never on a specific title.
#   * Saving kicks off server-side acquisition (yt-dlp). The track is `pending`
#     for tens of seconds and only then `ready`. The flow asserts the save
#     *lifecycle started* and that the row reaches the library — it does NOT wait
#     for audio, which would make the test a download-speed test.
#
# Fixture credentials come from .env.local — see e2e/README.md.
appId: com.altune.mobile
env:
  E2E_FIXTURE_EMAIL: ${E2E_FIXTURE_EMAIL}
  E2E_FIXTURE_PASSWORD: ${E2E_FIXTURE_PASSWORD}
  # A query with an unambiguous, always-present top result across providers.
  E2E_SEARCH_QUERY: "Bohemian Rhapsody"
---
- launchApp:
    clearState: true

# --- sign in ---------------------------------------------------------------
- assertVisible:
    id: "sign-in-screen"
- tapOn:
    id: "email-input"
- inputText: ${E2E_FIXTURE_EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${E2E_FIXTURE_PASSWORD}
- tapOn:
    id: "submit-button"
- assertVisible:
    text: "Library"
    timeout: 15000

# --- search ----------------------------------------------------------------
- tapOn:
    text: "Discover"
- assertVisible:
    id: "discover-search-input"
- tapOn:
    id: "discover-search-input"
- inputText: ${E2E_SEARCH_QUERY}
- pressKey: Enter
# Live providers: assert the results container arrives, not a specific title.
- assertVisible:
    id: "discover-results"
    timeout: 20000

# --- open detail -----------------------------------------------------------
# The blended view's top result. Position 0 of the first section always exists
# whenever `discover-results` rendered.
- tapOn:
    id: "discover-top-result"
- assertVisible:
    id: "detail-header"
    timeout: 10000

# --- save ------------------------------------------------------------------
# Only track detail has a save control; if the top result was an album/artist,
# this step is skipped rather than failing the flow — the library assertion
# below is then satisfied by whatever the account already holds.
- runFlow:
    when:
      visible:
        id: "detail-save"
    commands:
      - tapOn:
          id: "detail-save"
      # The optimistic placeholder lands in the library cache immediately, so the
      # control must leave its idle state without waiting on the server.
      - assertNotVisible:
          text: "Save"
          timeout: 10000

# --- play ------------------------------------------------------------------
# Play is enabled for a downloaded track and falls back to the 30s preview
# otherwise; either proves the playback path is wired.
- runFlow:
    when:
      visible:
        id: "detail-preview"
    commands:
      - tapOn:
          id: "detail-preview"
      # The mini player docks above the tab bar once something is playing.
      - assertVisible:
          id: "mini-player"
          timeout: 15000

# --- the saved track reached the library -----------------------------------
- tapOn:
    text: "Library"
- assertVisible:
    text: "Library"
    timeout: 10000
- tapOn:
    text: "Tracks"
- assertVisible:
    id: "library-tracks-list"
    timeout: 10000
